# mise tool versions
# https://mise.jdx.dev/
#
# プロジェクトで利用するランタイムのバージョンを固定する。
# `mise install` でこのファイルに記載されたバージョンが自動的にインストールされ、
# `mise activate` 済みのシェルではディレクトリ移動時に自動切り替えされる。
#
# - node: `package.json` の `engines.node` (`>=22.22.1 <23 || >=24.11.0 <25`) を
#         満たすバージョン。推奨ランタイムとして 24 系（現行の Active LTS 線）の
#         minor を固定し、patch は mise が自動追従する（issue #199 で 22.22 から移行）。
#         レンジの根拠と Node 22/23 系の扱いは、README「セットアップ > 必要環境」と
#         docs/UPGRADE_STRATEGY.md の履歴（2026-08-03 issue #178、2026-08-04
#         issue #199）を参照。
#
# pnpm は本ファイルでは管理せず、Node.js に同梱される Corepack 経由で
# `package.json` の `packageManager` フィールド (`pnpm@10.30.2+sha512...`) から
# SHA 検証付きでインストールする（Corepack の同梱は Node 24 まで）。バージョン定義を
# 1 箇所に集約することで mise.toml と packageManager の食い違いを構造的に防ぐ。
[tools]
node = "24.19"
