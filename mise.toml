# mise tool versions
# https://mise.jdx.dev/
#
# プロジェクトで利用するランタイム / パッケージマネージャのバージョンを固定する。
# `mise install` でこのファイルに記載されたバージョンが自動的にインストールされ、
# `mise activate` 済みのシェルではディレクトリ移動時に自動切り替えされる。
#
# - node: `package.json` の `engines.node` (`>=22.18 <23`) を満たす最新 minor 系。
#         minor を固定し、patch は mise が自動追従する。
# - pnpm: `package.json` の `packageManager` (`pnpm@10.30.2`) と `engines.pnpm`
#         (`>=10.30.2 <11`) に整合させ、patch まで固定する。
[tools]
node = "22.22"
pnpm = "10.30.2"
