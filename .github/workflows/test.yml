name: Test

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # engines.node（>=24.11.0 <25）が許容する唯一の系列である 24 系の
          # 単一バージョンで実行する（issue #265。lint.yml / security.yml と同一）
          node-version: '24'
          cache: 'pnpm'

      # Aikido Safe Chain を導入し、次の依存取得をマルウェア検査と最小経過時間ガード
      # （.aikido の minimumPackageAgeHours）の対象にする（issue #267）
      - name: Setup Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test --run

      # GAS へデプロイする dist/ の生成（pnpm build = vp build と Tailwind CSS のビルド）が成功する
      # ことを確認する（issue #272）。pnpm-workspace.yaml の catalog で vite-plus と vite
      # （@voidzero-dev/vite-plus-core の別名）の版が食い違うと、lint とテストは成功し、vp build だけが
      # 「Expected @voidzero-dev/vite-plus-core@X, but found Y」で失敗する。Dependabot は catalog の
      # vite-plus だけを更新するため、その PR を本ステップで失敗させる。本ジョブ（Unit Tests）は
      # main のルールセットの必須チェックであるため、dependabot-auto-merge.yml による自動マージも止まる。
      - name: Run build
        run: pnpm build
