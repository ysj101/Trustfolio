name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Dependabot PRではスキップする（シークレットアクセス制限のため）
    if: github.actor != 'dependabot[bot]'

    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT ACTION: ${{ github.event.action }}

            If EVENT ACTION is 'opened':
            - This is the initial PR review. Please provide a comprehensive review of all changes.
            - Review all aspects: code quality, best practices, potential bugs, performance, security, and test coverage.

            If EVENT ACTION is 'synchronize':
            - This is an update to an existing PR. Please review only the newly added changes since the last review.
            - Focus on the incremental changes and how they affect previously reviewed code.
            - First, use `gh pr diff` to understand what changed in this update compared to the previous commit.
            - Only review the modified/added code, not the entire PR again.

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            HOW TO POST YOUR REVIEW (strict rules — follow exactly):
            - Post your review as EXACTLY ONE pull request comment. Never post more than once per run.
            - NEVER post placeholder, test, scratch, or debugging comments (e.g. "test", "line1").
              Only post the single final, complete review.
            - Do NOT pass the comment body inline with `-b` / `--body`. Inline bodies break on
              backticks, code blocks, and newlines, which leads to repeated trial-and-error comments.
            - Instead, write the full review text to a file with the Write tool (e.g. /tmp/review.md),
              then post it exactly once with:
              `gh pr comment "$PR_NUMBER" --body-file /tmp/review.md`

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # Write tool is allowed so the review body can be written to a file and posted via
          # `gh pr comment --body-file`, avoiding shell-escaping issues with backticks/newlines.
          claude_args: '--allowed-tools "Write,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

