name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # 公開後は外部の利用者が Issue / コメント / レビューに @claude を書けてしまう。
    # その本文を書いた人の author_association が OWNER / MEMBER / COLLABORATOR のときだけ起動する。
    # メンションが載るオブジェクトはイベントごとに違う。別オブジェクトの association
    # （例: issue_comment では issue 作成者）を見ると、所有者の Issue への外部コメントでも起動してしまう。
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@aa8a7738e48bf30a40ee499ce818bef081c5ab5e # v1.0.257
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Claude へ渡す Issue / PR のコメント・レビュー・レビューコメントを、リポジトリ所有者と
          # claude[bot] が書いたものに限る。上の if で起動できる人は制限しているが、起動者が
          # @claude を書いた Issue / PR に外部の利用者のコメントがあると、既定ではそれも Claude の
          # 入力になり、プロンプトインジェクションの経路になるためである。
          # - claude[bot] を含めるのは、Claude の過去の返信と Claude Code Review のレビューを
          #   続きの依頼で参照できるようにするためである。
          # - 照合は大文字小文字を区別する完全一致である。action は bot の名前を "[bot]" 付きに
          #   正規化してから照合する。
          # - @claude を書いた起動コメント自体はイベントから直接渡るため、本設定の対象外である。
          #   上の if は MEMBER / COLLABORATOR の起動も許すが、本設定は所有者以外の過去のコメントを
          #   渡さない。共同編集者を追加し、その人のコメントも参照させる場合は名前を加えること。
          # - Issue / PR の本文はこの設定の対象外であり、外部の利用者が書いた本文は Claude に渡る。
          #   外部の利用者が作成した Issue / PR では、本文を確認してから @claude を書くこと。
          include_comments_by_actor: '${{ github.repository_owner }},claude[bot]'

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr:*)'

