name: Security Check

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # pnpm audit は pnpm-lock.yaml の静的検査でありランタイムのバージョンに
          # 依存しないため、Node 22/24 のマトリクス（test.yml / lint.yml）対象外とし
          # 単一バージョン（推奨ランタイムの 24 系。issue #199）で実行する
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 全依存関係（devDependencies 含む）を監査する。
      #
      # 脆弱性単位の例外は package.json の pnpm.auditConfig
      # （ignoreCves / ignoreGhsas）で管理する。例外の対象・理由・見直し条件は
      # package.json 側ではコメントが書けないため、ここに記録する。
      #
      # 現在の例外は、いずれも devDependency @google/clasp@3.3.0（最新版）→
      # @modelcontextprotocol/sdk 配下の推移的依存であり、上流の修正（または修正版の
      # 解決可能化）を待つ間だけ CI をブロックしないための時限的な例外である。
      #
      # 影響経路の評価: 対象パッケージ（hono / @hono/node-server / body-parser /
      # fast-uri）は clasp の MCP サーバー・ローカル HTTP サーバー機能でのみ使用され、
      # 本リポジトリでの clasp 利用は CLI（clasp push）によるデプロイのみである。
      # GAS へデプロイされる成果物（dist/）にはこれらのパッケージは含まれない。
      #
      # 見直し条件: @google/clasp（または @modelcontextprotocol/sdk）の更新で
      # 修正版に解決されたら、pnpm.auditConfig から該当 ID を削除すること。
      # 新規の例外を追加する場合は、必ず影響経路の評価と理由をここへ追記すること。
      #
      # 例外一覧（パッケージ / 修正版）:
      #   CVE-2026-12590      body-parser <2.3.0（low）
      #   CVE-2026-59897      hono <4.12.27（moderate）
      #   CVE-2026-59896      hono <4.12.27（moderate）
      #   CVE-2026-59895      hono <4.12.27（moderate）
      #   CVE-2026-13676      fast-uri <3.1.3（high）
      #   GHSA-frvp-7c67-39w9 @hono/node-server <2.0.5（moderate・CVE未採番）
      #   GHSA-8j4g-w8fx-2239 hono <4.12.34（moderate・CORS ミドルウェアの ReDoS。
      #     2026-08-04 追加。修正版 4.12.34 は 2026-08-03 公開だが、ローカルの
      #     Safe-chain（最小パッケージ経過日数ガード）が公開直後のため解決を
      #     抑止しており、pnpm.overrides で強制できない。影響経路は上記と同じ
      #     clasp → @modelcontextprotocol/sdk 配下の devDependency のみで、
      #     GAS へデプロイされる成果物には含まれない。
      #     解除条件: 経過日数ガードを満たし次第、pnpm.overrides の hono を
      #     `>=4.12.34 <5` へ引き上げて本例外を削除すること）
      - name: Run security audit
        run: pnpm audit --audit-level moderate
