name: Security Check

# 起動条件（issue #267）:
# - pull_request: 依存関係（package.json / pnpm-lock.yaml）または本ワークフローを変更した PR
#   だけを監査する。監査結果はコードではなく外部の脆弱性データベースによって変わるため、
#   依存を変更していない PR を、新たに公表されたアドバイザリで失敗させないためである。
#   main の脆弱性は push と schedule の監査で検出する。
# - push: main / develop へのすべての push で全依存を監査する。
# - schedule: 毎日 21:17 UTC（06:17 JST）に main の全依存を監査し、新たに公表された
#   アドバイザリを PR より先に検出する。GitHub Actions は毎時 0 分付近が高負荷で、
#   schedule の遅延や実行の欠落が起きやすいため、0 分を避けている。schedule は
#   デフォルトブランチ（main）でのみ実行される。
# - workflow_dispatch: 手動実行用。main で実行すると、失敗時の issue 起票まで確認できる。
#
# schedule / workflow_dispatch で監査が失敗した場合は、report ジョブが issue を起票する。
on:
  pull_request:
    branches:
      - main
      - develop
    # 注意: 本チェック（Dependency Audit）を必須ステータスチェックにすると、paths で除外された
    # PR ではチェックが報告されず、待機状態のままマージできなくなる。必須化するときは
    # 本方式を見直すこと（2026-10-09 時点で、本リポジトリに必須チェックは設定していない）。
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/security.yml'
  push:
    branches:
      - main
      - develop
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

# 既定の権限はリポジトリ内容の読み取りだけに絞る。issue の書き込み権限は report ジョブにだけ付与する。
permissions:
  contents: read

env:
  # pnpm audit の監査レベル。audit ジョブの合否判定と report ジョブの集計で同じ値を使う。
  AUDIT_LEVEL: moderate

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # engines.node（>=24.11.0 <25）が許容する唯一の系列である 24 系の
          # 単一バージョンで実行する（issue #265。test.yml / lint.yml と同一）
          node-version: '24'
          cache: 'pnpm'

      # Aikido Safe Chain を導入し、次の依存取得をマルウェア検査と最小経過時間ガード
      # （.aikido の minimumPackageAgeHours）の対象にする（issue #267）
      - name: Setup Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 全依存関係（devDependencies 含む）を監査する。
      #
      # 脆弱性への対処は pnpm.overrides による修正版への強制を既定とし、
      # 検出を抑止する pnpm.auditConfig の例外は用いない（issue #173）。
      #
      # 修正版が未リリース等でやむを得ず auditConfig（ignoreCves / ignoreGhsas）へ
      # 例外を追加する場合は、package.json 側にコメントを書けないため、
      # 対象 ID・理由・影響経路の評価・解除条件を必ずここへ記録すること。
      #
      # 現在の例外（package.json の pnpm.auditConfig.ignoreGhsas）:
      #   GHSA-vfj7-8cjw-p6xm braces <=3.0.3（high・2026-10-05 追加）
      #     内容: 深くネストしたブレースパターンを渡すと、再帰処理の呼び出しスタックが
      #       枯渇して Node.js プロセスが RangeError で停止する（サービス拒否）。
      #     理由: 修正版が未リリースである（アドバイザリの first_patched_version が null。
      #       npm 上の最新版 3.0.3 自体が脆弱範囲に含まれる）。pnpm.overrides で強制できる
      #       修正版が存在せず、依存元の @google/clasp も最新版 3.4.1 が micromatch ^4.0.8
      #       経由で braces に依存し続けている。
      #     影響経路の評価: braces は devDependency の次の2経路でのみ使用される。
      #       - @google/clasp → micromatch → braces: clasp が push 対象ファイルを絞り込む際に、
      #         .claspignore（本リポジトリには存在しない）と clasp 既定の除外パターンを解析する。
      #       - @tailwindcss/cli → @parcel/watcher → micromatch → braces: watch モードの
      #         監視除外パターンを解析する。@parcel/watcher は watch モードでのみ動的 import
      #         されるが、本リポジトリの CSS ビルド（package.json の build:css →
      #         scripts/build-styles.sh）は --watch を付けずに実行するため、読み込まれない。
      #       いずれも解析対象のパターンは開発者が管理する設定由来であり、外部入力は渡らない。
      #       また GAS へデプロイされる成果物（dist/Code.js・dist/*.html）には含まれない。
      #     解除条件: braces の修正版が公開され、ローカルの Safe-chain（最小パッケージ経過
      #       日数ガード）で解決可能になり次第、pnpm.overrides に修正版への強制を追加し、
      #       本例外（ignoreGhsas の当該 ID と本コメント）を削除すること。
      - name: Run security audit
        run: pnpm audit --audit-level "${AUDIT_LEVEL}"

  # schedule / workflow_dispatch で audit ジョブが失敗したとき、issue を起票する（issue #267）。
  #
  # - 依存をインストールせず、pnpm audit を package.json と pnpm-lock.yaml だけから再実行して
  #   検出内容を取得する。依存パッケージを取得・展開するジョブに issues: write を与えないためである。
  # - issue 本文は scripts/build-audit-failure-issue.mjs が生成する。再監査でアドバイザリが
  #   0 件だった場合（audit ジョブが脆弱性以外の理由で失敗した場合）も、その旨を記載して起票する。
  # - 再監査の出力を JSON として解釈できない場合（再監査でもレジストリの障害が続いた場合など）は、
  #   本文の生成を例外で中止し（fail fast）、本ジョブは issue を起票せずに失敗する。形式を
  #   解釈できない出力を「0 件」と誤って報告しないためである。この失敗は、GitHub Actions の
  #   失敗通知で検知する。schedule の通知は、本ワークフローの cron を最後に変更したユーザー
  #   （GitHub の通知設定で Actions の通知を有効にしている場合）へ送られる。
  # - 同じタイトルのオープン issue があれば新規起票せず、その issue にコメントを追記する。
  # - GITHUB_TOKEN で作成した issue は、claude.yml などのワークフローを起動しない（GitHub の仕様）。
  #   起票された issue は issue-resolve スキルで対応する。
  report:
    name: Report Audit Failure
    needs: audit
    if: ${{ failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Re-run audit as JSON
        run: |
          # pnpm audit は脆弱性を検出すると終了コード 1 を返すため、終了コードではステップを
          # 失敗させない。出力を JSON として解釈できるかは、次のステップのスクリプトが検証する。
          set +e
          pnpm audit --json --audit-level "${AUDIT_LEVEL}" > "${RUNNER_TEMP}/audit.json"
          status=$?
          set -e
          echo "pnpm audit の終了コード: ${status}"

      - name: Build issue body
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/build-audit-failure-issue.mjs \
            --audit-json "${RUNNER_TEMP}/audit.json" \
            --audit-level "${AUDIT_LEVEL}" \
            --run-url "${RUN_URL}" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --commit-sha "${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/issue-body.md"

      - name: Create or comment on issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Dependency Audit の定期監査で脆弱性を検出しました
        run: |
          # 同じタイトルのオープン issue を完全一致で探す。検索 API は索引の反映が遅れることが
          # あるため、オープン issue の一覧を取得してタイトルで絞り込む。
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 1000 \
            --json number,title \
            --jq '[.[] | select(.title == $ENV.ISSUE_TITLE)][0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" \
              --body-file "${RUNNER_TEMP}/issue-body.md"
            echo "既存の issue #${existing} にコメントを追記しました。"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${ISSUE_TITLE}" \
              --label dependencies --body-file "${RUNNER_TEMP}/issue-body.md"
          fi
