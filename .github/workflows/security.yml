name: Security Check

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # pnpm audit は pnpm-lock.yaml の静的検査でありランタイムのバージョンに
          # 依存しないため、Node 22/24 のマトリクス（test.yml / lint.yml）対象外とし
          # 単一バージョン（推奨ランタイムの 24 系。issue #199）で実行する
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 全依存関係（devDependencies 含む）を監査する。
      #
      # 脆弱性への対処は pnpm.overrides による修正版への強制を既定とし、
      # 検出を抑止する pnpm.auditConfig の例外は用いない（issue #173）。
      #
      # 修正版が未リリース等でやむを得ず auditConfig（ignoreCves / ignoreGhsas）へ
      # 例外を追加する場合は、package.json 側にコメントを書けないため、
      # 対象 ID・理由・影響経路の評価・解除条件を必ずここへ記録すること。
      - name: Run security audit
        run: pnpm audit --audit-level moderate
