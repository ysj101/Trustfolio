name: Security Check

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 全依存関係（devDependencies 含む）を監査する。
      #
      # 脆弱性単位の例外は package.json の pnpm.auditConfig
      # （ignoreCves / ignoreGhsas）で管理する。例外の対象・理由・見直し条件は
      # package.json 側ではコメントが書けないため、ここに記録する。
      #
      # 現在の例外6件は、いずれも devDependency @google/clasp@3.3.0（最新版）→
      # @modelcontextprotocol/sdk 配下の推移的依存であり、上流の修正を待つ間だけ
      # CI をブロックしないための時限的な例外である。
      #
      # 影響経路の評価: 対象パッケージ（hono / @hono/node-server / body-parser /
      # fast-uri）は clasp の MCP サーバー・ローカル HTTP サーバー機能でのみ使用され、
      # 本リポジトリでの clasp 利用は CLI（clasp push）によるデプロイのみである。
      # GAS へデプロイされる成果物（dist/）にはこれらのパッケージは含まれない。
      #
      # 見直し条件: @google/clasp（または @modelcontextprotocol/sdk）の更新で
      # 修正版に解決されたら、pnpm.auditConfig から該当 ID を削除すること。
      # 新規の例外を追加する場合は、必ず影響経路の評価と理由をここへ追記すること。
      #
      # 例外一覧（パッケージ / 修正版）:
      #   CVE-2026-12590      body-parser <2.3.0（low）
      #   CVE-2026-59897      hono <4.12.27（moderate）
      #   CVE-2026-59896      hono <4.12.27（moderate）
      #   CVE-2026-59895      hono <4.12.27（moderate）
      #   CVE-2026-13676      fast-uri <3.1.3（high）
      #   GHSA-frvp-7c67-39w9 @hono/node-server <2.0.5（moderate・CVE未採番）
      - name: Run security audit
        run: pnpm audit --audit-level moderate
