# Aikido Safe Chain を CI へ導入する composite action（issue #267）。
#
# 目的:
#   以降のステップで実行する pnpm の依存取得を、Safe Chain のプロキシ経由にする。
#   これにより、取得するパッケージがマルウェア検査と最小経過時間ガード（リポジトリ直下の
#   .aikido の minimumPackageAgeHours）の対象になる。
#
# 内容:
#   1. 版を固定したインストーラを取得し、SHA256 を検証してから --ci モードで実行する。
#      --ci は GITHUB_PATH にシムのディレクトリを追加する。GITHUB_PATH に後から追加した
#      ディレクトリは PATH の前方に入るため、pnpm/action-setup が配置した pnpm よりも
#      Safe Chain のシムが先に解決される。インストーラ自身も、取得したバイナリの SHA256 を検証する。
#   2. `pnpm safe-chain-verify` を実行し、シムが有効であることを確認する。有効でなければ
#      ジョブを失敗させ、検査を経由しない依存取得を防ぐ（fail fast）。
#
# 注意:
#   - pnpm/action-setup と actions/setup-node の後、`pnpm install` の前に呼び出すこと。
#     pnpm が PATH にない状態では safe-chain-verify が実行できない。
#   - SHA256 は、リリース資産の install-safe-chain.sh から算出した値を、Safe Chain
#     リポジトリの main ブランチの README の値と照合してから書く。版のタグ時点の README には
#     前の版の値が載っているため参照しない。版の更新手順は docs/UPGRADE_STRATEGY.md の
#     「Aikido Safe Chain の記録」を参照すること。本ファイルは版を URL に直接書くため、
#     Dependabot の追跡対象にならない。
#   - actions/setup-node の `cache: 'pnpm'` で復元されたパッケージはダウンロードされないため、
#     Safe Chain の検査を経由しない。
#   - pnpm 本体は、本 action より前に pnpm/action-setup が取得するため、Safe Chain の検査を
#     経由しない。pnpm の版は package.json の packageManager で固定している。
name: Setup Aikido Safe Chain
description: Aikido Safe Chain を版固定・SHA256 検証付きで導入し、pnpm のシムが有効であることを検証する

runs:
  using: composite
  steps:
    - name: Install safe-chain
      shell: bash
      env:
        SAFE_CHAIN_VERSION: '1.5.24'
        SAFE_CHAIN_INSTALLER_SHA256: '99eb124a3404b3ac99e8b65406b87c4ee049c1d6c17757a7d04991ae60d16e69'
      run: |
        installer="${RUNNER_TEMP}/install-safe-chain.sh"
        curl -fsSL "https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_VERSION}/install-safe-chain.sh" -o "${installer}"
        echo "${SAFE_CHAIN_INSTALLER_SHA256}  ${installer}" | sha256sum -c -
        sh "${installer}" --ci
        rm "${installer}"

    - name: Verify safe-chain
      shell: bash
      run: |
        # シムが有効であれば Safe Chain が safe-chain-verify を処理して成功メッセージを出力する。
        # シムが無効な場合、pnpm は safe-chain-verify を未知のコマンドとして失敗する。
        output="$(pnpm safe-chain-verify)"
        printf '%s\n' "${output}"
        if ! grep -qF 'OK: Safe-chain works!' <<<"${output}"; then
          echo '::error::Aikido Safe Chain のシムが有効ではありません。依存の取得を中止します。'
          exit 1
        fi
