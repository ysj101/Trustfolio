version: 2
updates:
  - package-ecosystem: "pnpm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # メジャーバージョンアップは段階的に手動で実施する（docs/UPGRADE_STRATEGY.md参照）
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production:
        dependency-type: "production"
        update-types:
          - "patch"

  # GitHub Actions のアクション更新を監視する（#162）。
  # 全アクションはコミットハッシュ＋バージョンコメント（# vX.Y.Z）でピン留めしており、
  # dependabot はコメントの semver を解釈して新しいハッシュへの更新PRを作成する。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
