version: 2
updates:
  # pnpm を利用しているが、Dependabot の仕様では npm / yarn / pnpm はまとめて
  # package-ecosystem "npm" を指定する（"pnpm" という値は存在せずパースエラーになる）。
  # 参照: https://docs.github.com/en/code-security/dependabot/ecosystems-supported-by-dependabot/supported-ecosystems-and-repositories
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # メジャーバージョンアップは段階的に手動で実施する（docs/UPGRADE_STRATEGY.md参照）
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production:
        dependency-type: "production"
        update-types:
          - "patch"

  # GitHub Actions のアクション更新を監視する（#162）。
  # 全アクションはコミットハッシュ＋バージョンコメント（# vX.Y.Z）でピン留めしており、
  # dependabot はコメントの semver を解釈して新しいハッシュへの更新PRを作成する。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
