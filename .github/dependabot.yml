version: 2
updates:
  # pnpm を利用しているが、Dependabot の仕様では npm / yarn / pnpm はまとめて
  # package-ecosystem "npm" を指定する（"pnpm" という値は存在せずパースエラーになる）。
  # 参照: https://docs.github.com/en/code-security/dependabot/ecosystems-supported-by-dependabot/supported-ecosystems-and-repositories
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # 同時にオープンできるPR数の上限。個別PRとグループPRの合計に対して効き、
    # 上限に達すると新規PRは黙って作成されなくなる（=メジャー更新を取りこぼす）。
    # 最悪ケースは「devDependencies 12件のうち、個別PRを生みうる8件が同時に個別PRを持つ
    # ＋ development グループPR 1本」＝9本。個別PRを生みうる8件は、major 除外の
    # typescript-js-api と、全更新を除外した vite / vitest / @vitest/coverage-v8（下の ignore を参照）を
    # 除いたものである。vite-plus と @google/clasp は development グループから外しているため minor / patch も
    # 個別PRになるが、1パッケージにつき同時に開くPRは1本である。
    # production グループは dependencies が0件のためPRを生まない。
    # これに予備2本を加えて 11 とする（issue #272 で oxfmt / oxlint を削除し 16 から変更）。
    # 依存パッケージを増やす際は本値の見直しが必要である。
    open-pull-requests-limit: 11
    # バージョン更新の対象を、公開から 3 日（72 時間）以上経過した版に限る（issue #267）。
    # CI は Aikido Safe Chain 経由で依存を取得し、公開から 48 時間未満の版を取得させない
    # （リポジトリ直下の .aikido の minimumPackageAgeHours）。cooldown をそれより長くする
    # ことで、Dependabot が提案した直接依存の版が CI で取得できずに失敗することを防ぐ。
    # Dependabot は未設定でも既定で 3 日の cooldown を適用するが、上記の前提を設定上で
    # 明示し、既定値への暗黙の依存を避けるために明記する。
    # 注意: cooldown はセキュリティ更新には適用されない。また、ロックファイルの再生成で
    # 推移的依存が公開から 48 時間未満の版に解決された場合は、CI が失敗することがある
    # （48 時間の経過後にジョブを再実行すれば解消する）。
    cooldown:
      default-days: 3
    ignore:
      # typescript-js-api は npm:typescript@^6.0.3 のエイリアスであり、6系への固定は
      # 「遅れ」ではなく意図的な設計判断である。typescript@7（ネイティブ実装）は
      # 従来の JS コンパイラ API を同梱しておらず、これに依存する
      # scripts/check-architecture.mjs と scripts/check-typescript-rules.mjs
      #（いずれも pnpm lint の構成要素）が動作しなくなるため、7系へ上げてはならない。
      # 詳細と解除条件は docs/UPGRADE_STRATEGY.md の
      # 「エイリアス devDependency `typescript-js-api`」セクションを参照。
      # なお本エントリが（Dependabot のエイリアス依存の扱いにより）マッチしなかった
      # 場合でも、当該更新は pnpm lint の失敗としてCIで検知される（fail fast）。
      - dependency-name: "typescript-js-api"
        update-types: ["version-update:semver-major"]
      # vite / vitest / @vitest/coverage-v8 の版は、vite-plus が決める（issue #272）。
      # - vite は @voidzero-dev/vite-plus-core（Vite+ 版の vite）への別名であり、vite-plus と
      #   同じ版でなければ vp build が失敗する。
      # - vitest と @vitest/coverage-v8 は、vite-plus が同梱する Vitest の版にそろえる。
      # これらは pnpm-workspace.yaml の catalog にあり、vite-plus の更新時に vp migrate で
      # まとめて更新する（手順は docs/UPGRADE_STRATEGY.md の「Vite+（vp）への一本化の記録」）。
      # 単独で更新すると vite-plus との組み合わせが崩れるため、すべての更新を除外する。
      - dependency-name: "vite"
      - dependency-name: "vitest"
      - dependency-name: "@vitest/coverage-v8"
    # 上記の ignore の対象（typescript-js-api の major、vite / vitest / @vitest/coverage-v8 の全更新）を
    # 除き、メジャーバージョンアップも検知対象とする。
    # 下の groups は development が minor / patch、production が patch のみを対象とするため、
    # major はどのグループにも該当せず「1パッケージにつき1本」の個別PRとして起票される。
    # これは docs/UPGRADE_STRATEGY.md の「メジャーは段階的に実施」方針と整合する。
    #
    # 注意: Dependabot が提案するのは常に最新バージョンへの1回のジャンプであり、
    # 複数メジャーを跨ぐ場合でも中間バージョンを経由するPRは作られない。
    # したがって major のPRは「更新が出たことの検知」として扱い、実際の適用は
    # docs/UPGRADE_STRATEGY.md の「メジャーバージョンアップ手順」に従って段階的に行う。
    # なお major は dependabot-auto-merge.yml の自動マージ対象外（同ワークフローは
    # version-update:semver-patch のみを対象とする）であり、必ず手動レビューを経る。
    groups:
      development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        # vite-plus の更新 PR は、Dependabot が catalog の vite-plus だけを更新するため、
        # vp migrate で vite / vitest / @vitest/coverage-v8 をそろえるまで CI（test.yml の
        # Run build）が失敗する。グループに含めると他の devDependencies の更新まで止まるため、
        # 個別PRにする（issue #272）。
        # @google/clasp の更新 PR は、zod の強制（pnpm-workspace.yaml の "@google/clasp@<版>>zod"）の
        # 版の付け替えまで tests/dependencies/zod-override.test.ts が失敗する。同じ理由で個別PRにする（issue #291）。
        exclude-patterns:
          - "vite-plus"
          - "@google/clasp"
      production:
        dependency-type: "production"
        update-types:
          - "patch"

  # GitHub Actions のアクション更新を監視する（#162）。
  # 全アクションはコミットハッシュ＋バージョンコメント（# vX.Y.Z）でピン留めしており、
  # dependabot はコメントの semver を解釈して新しいハッシュへの更新PRを作成する。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
