version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # メジャーバージョンアップは段階的に手動で実施する（docs/UPGRADE_STRATEGY.md参照）
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production:
        dependency-type: "production"
        update-types:
          - "patch"
