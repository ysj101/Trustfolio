# pnpm の設定（overrides・peerDependencyRules 等）と catalog（issue #272）。
#
# issue #272 で Vite+ 1.x へ移行した際に、vp migrate が package.json の "pnpm" フィールドから
# 本ファイルへ移した。pnpm 10.6.2 以降は本ファイルを設定の正本として読む（pnpm 11 は
# package.json の "pnpm" フィールドを読まない）。
#
# 注意:
#   - package.json に "pnpm" フィールドを再び追加してはならない。package.json に pnpm.overrides が
#     あると、pnpm は本ファイルの overrides を無視する（Vite+ のドキュメント「Update Vite+」）。
#   - 本ファイルを変更した PR では、.github/workflows/security.yml の Dependency Audit が起動する。
#   - 各設定の判断理由は次の場所に記録する。
#     - auditConfig の例外: .github/workflows/security.yml の「Run security audit」ステップのコメント
#     - overrides の "@google/clasp@<版>>zod": docs/UPGRADE_STRATEGY.md の「zod の強制（"@google/clasp@<版>>zod"）の記録」
#     - overrides（脆弱性への対処）: issue #173 の方針（修正版への強制を既定とする）。新たに修正版を
#       強制するときは `<パッケージ>@<脆弱な範囲>: ">=<修正版> <次のメジャー>"` の形で書き、完全一致の版へ
#       固定しない。完全一致の固定は、修正版の公開後も古い版に留め、再び監査の失敗を招く（issue #288）。
#       親セレクタのない項目の `@` の後ろの範囲は、解決済みの版ではなく、依存元が宣言した範囲との重なりで判定
#       される（pnpm 10.30.2 の @pnpm/hooks.read-package-hook で確認、issue #291）。重なった宣言は、`^3.25 || ^4.0`
#       のように複数のメジャーにまたがる宣言も含めて置き換えの対象になる。そのため、項目を追加・変更するときは、
#       そのパッケージを宣言する依存（`pnpm why <パッケージ>`）と、その宣言の範囲（`pnpm view <依存元>@<版>
#       <フィールド>` を dependencies・optionalDependencies・peerDependencies ごとに実行する）を確かめ、`@` の後ろの
#       範囲と右辺の上限を決めた理由を docs/UPGRADE_STRATEGY.md の「履歴」に記録する（例: issue #288 の
#       ip-address、issue #291 の qs・body-parser・fast-uri）。pnpm-lock.yaml からは、推移的依存（ルートの
#       package.json 以外の依存元）が宣言した範囲を確かめられない（dependencies の範囲は記録されず、
#       peerDependencies の範囲は overrides で置き換えた後の値が記録される）。
#       例外: 依存元の宣言範囲の外（別のメジャー）へ強制せざるをえない場合は、範囲外への強制を、動作を
#       確認した依存元の版に限る親セレクタ（`<依存元>@<確認した版>><パッケージ>`）で書く（issue #291）。
#       親セレクタの `<確認した版>` は、依存元の宣言ではなく、依存元の解決済みの版で判定される。
#     - peerDependencyRules: docs/UPGRADE_STRATEGY.md の「peer 依存の明示的許容（peerDependencyRules）の記録」
#     - catalog と overrides の vite@* / vitest@*: docs/UPGRADE_STRATEGY.md の「Vite+（vp）への一本化の記録」

overrides:
  qs@>=6.0.0 <6.16.0: ">=6.16.0 <7"
  minimatch: ">=10.2.3"
  express-rate-limit: ">=8.2.2"
  "@hono/node-server": ">=2.0.5 <3"
  hono: ">=4.13.7 <5"
  body-parser@>=2.0.0 <2.4.0: ">=2.4.0 <3"
  yaml: 2.8.3
  path-to-regexp: 8.4.0
  picomatch@<2.3.2: 2.3.2
  picomatch@>=4.0.0 <4.0.4: 4.0.4
  ip-address@>=10.0.0 <10.7.4: ">=10.7.4 <11"
  fast-uri@>=3.0.0 <3.1.9: ">=3.1.9 <4"
  uuid@<14.0.0: ">=14.0.0"
  esbuild@<0.28.1: ">=0.28.1"
  postcss@<8.5.23: ">=8.5.23"
  brace-expansion@>=4.0.0 <5.0.12: ">=5.0.12 <6"
  tinypool@<2.1.2: ">=2.1.2 <3"
  proxy-addr@<2.0.8: ">=2.0.8 <3"
  source-map-js@<1.2.2: ">=1.2.2 <2"
  "@modelcontextprotocol/sdk@<1.31.0": ">=1.31.0 <2"
  # zod の GHSA-mrhx-c7xc-m3w5（issue #291）。clasp の宣言範囲（zod 3 系）の外の 4 系への強制であり、動作を
  # 確認した clasp の版に限る。判断理由・clasp を更新するときの手順は docs/UPGRADE_STRATEGY.md の
  # 「zod の強制（"@google/clasp@<版>>zod"）の記録」、前提の検査は tests/dependencies/zod-override.test.ts。
  "@google/clasp@3.4.1>zod": ">=4.6.6 <5"
  # 依存ツリー内のすべての vite / vitest を catalog の版（Vite+ が同梱・指定する版）へそろえる。
  # vp migrate が追加した。"@*" を付けるのは、package.json の "catalog:" 参照を書き換えず、
  # 推移的依存と peer 依存の宣言だけを対象にするためである（Vite+ のドキュメント「Update Vite+」）。
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowedVersions:
    "@formatjs/intl@3.1.8>typescript": ^6.0.0 || ^7.0.0
    vitest@5.0.5>vite: 1.3.0
    "@vitest/mocker@5.0.5>vite": 1.3.0

# Vite+ のツールチェーンの版。4 項目は vite-plus の版に合わせて同時に更新しなければならない。
#   - vite は @voidzero-dev/vite-plus-core（Vite+ 版の vite）への別名である。vite-plus と同じ版で
#     なければ、vp build が「Expected @voidzero-dev/vite-plus-core@X, but found Y」で失敗する。
#   - vitest と @vitest/coverage-v8 は、vite-plus が同梱する Vitest の版（vp toolchain vitest）にそろえる。
# Dependabot は vite-plus の項目だけを更新する。更新は vp migrate で行う（手順は
# docs/UPGRADE_STRATEGY.md の「Vite+（vp）への一本化の記録」を参照）。
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
  "@vitest/coverage-v8": 5.0.5
