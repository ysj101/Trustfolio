<script>
  'use strict';

  (function () {
    const state = {
      funds: [],
      selectedTransactionFundId: null,
      editingTransactionId: null,
      editingTransactionType: null, // 'SPOT_PURCHASE' | 'REDEMPTION'
      editingRecurringId: null,
    };

    const app = document.querySelector('.app');
    const fundForm = document.getElementById('fundForm');
    const fundNameInput = document.getElementById('fundName');
    const fundAssetClassSelect = document.getElementById('fundAssetClass');
    const fundRakutenFundIdInput = document.getElementById('fundRakutenFundId');
    const fundNavSourceKindSelect = document.getElementById('fundNavSourceKind');
    const fundRakutenFundIdField = document.getElementById('fundRakutenFundIdField');
    const fundNavSourceCodeField = document.getElementById('fundNavSourceCodeField');
    const fundNavSourceCodeInput = document.getElementById('fundNavSourceCode');
    const fundNavSourceCodeCheckButton = document.getElementById('fundNavSourceCodeCheckButton');
    const fundNavSourceCodeCheckResult = document.getElementById('fundNavSourceCodeCheckResult');
    const fundSettlementBusinessDaysInput = document.getElementById('fundSettlementBusinessDays');
    const fundList = document.getElementById('fundList');

    // 利用者が基準価額とURLを読み比べて銘柄の同一性を判断できるよう、自動消去を無効化する。
    const setNavSourceCodeCheckMessage = window.TrustfolioUi.createSetMessage(
      fundNavSourceCodeCheckResult,
      { autoClearSuccessMs: null }
    );
    // Wealth Advisorへの連打による過剰アクセスを防ぐため、利用者と合意した実行間隔の下限。
    const NAV_SOURCE_CODE_CHECK_MIN_INTERVAL_MS = 5000;
    let lastNavSourceCodeCheckStartedAt = 0;
    let isNavSourceCodeCheckInFlight = false;

    /** 取得元種別ごとの入力グループ。表示切替と送信時の値取得で同じ配列を走査する。 */
    const navSourceInputGroups = Object.freeze([
      {
        kind: window.TrustfolioUi.NAV_SOURCE_KINDS.RAKUTEN,
        field: fundRakutenFundIdField,
        input: fundRakutenFundIdInput,
      },
      {
        kind: window.TrustfolioUi.NAV_SOURCE_KINDS.WEALTH_ADVISOR,
        field: fundNavSourceCodeField,
        input: fundNavSourceCodeInput,
      },
    ]);

    /**
     * 基準価額の取得元セレクトの選択に応じて、登録フォームの入力欄を切り替える。
     *
     * - 選択中の取得元に対応する入力欄だけを表示し、required を付ける。
     * - 非表示にした入力欄は required を外し、値をクリアする（詳細は setFieldGroupActive を参照）。
     * - 楽天ファンドIDと Wealth Advisor 取得元コードの排他性は、この表示切替ではなく
     *   fundForm の submit ハンドラが選択中グループの入力だけを読み、buildNavSourceFields が
     *   他方を必ず null にすることで保証する。
     * - 楽天証券→Wealth Advisor→楽天証券と切り替えると入力済みの ID は消える（仕様）。
     * - 対応表 navSourceInputGroups に無い種別（'none'）はすべての入力欄を非表示にする。
     * - 選択肢は populateNavSourceKindSelect が NAV_SOURCE_LABELS から生成するため、UI 操作では未知の値に
     *   ならない。未知の値は実装ミス（選択肢と navSourceInputGroups の食い違い）なので暗黙に補正せず
     *   例外を投げる（初期化時は IIFE の try/catch が表示する）。
     */
    function applyNavSourceKindToForm() {
      const kind = fundNavSourceKindSelect.value;
      const isKnownKind =
        kind === window.TrustfolioUi.NAV_SOURCE_KINDS.NONE ||
        navSourceInputGroups.some((group) => group.kind === kind);
      if (!isKnownKind) throw new Error(`未知の基準価額取得元種別です: ${String(kind)}`);
      // 取得元種別の切替時と登録成功後のフォームリセット時には、直前の確認結果は
      // 現在の入力内容を説明しなくなるため、結果表示を消去する。
      setNavSourceCodeCheckMessage('', null);
      navSourceInputGroups.forEach((group) => {
        setFieldGroupActive(group.field, group.input, group.kind === kind);
      });
    }

    /**
     * 取得元の入力グループ（ラッパー要素と入力欄）の表示／非表示を切り替える。
     *
     * - 非表示にするときは required を外し、値もクリアする。
     *   required の解除は、非表示の required 入力がブラウザの制約検証で送信をブロックするため必須。
     *   値のクリアは (1) 送信成功後のリセット（onSuccess の resetFormFields はこの 2 入力を含めず
     *   applyNavSourceKindToForm に依存する）と (2) 隠れた入力に古い値を残さないため。
     *   排他性の保証は本関数の責務ではない（submit ハンドラと buildNavSourceFields が担う）。
     * - 表示するときは required を付ける。
     *
     * @param {HTMLElement} container - 'hidden' クラスで表示制御するラッパー要素
     * @param {HTMLInputElement} input - グループ内の入力欄
     * @param {boolean} isActive - true で表示、false で非表示
     * @returns {void}
     */
    function setFieldGroupActive(container, input, isActive) {
      container.classList.toggle('hidden', !isActive);
      input.required = isActive;
      if (!isActive) input.value = '';
    }
    const transactionForm = document.getElementById('transactionForm');
    const transactionFundSelect = document.getElementById('transactionFundSelect');
    const transactionDateInput = document.getElementById('transactionDate');
    const transactionDateLabel = document.getElementById('transactionDateLabel');
    const transactionAmountInput = document.getElementById('transactionAmount');
    const transactionUnitsInput = document.getElementById('transactionUnits');
    const transactionSaleAmountInput = document.getElementById('transactionSaleAmount');
    const transactionIncomeTaxInput = document.getElementById('transactionIncomeTax');
    const transactionResidentTaxInput = document.getElementById('transactionResidentTax');
    const transactionNavValue = document.getElementById('transactionNavValue');
    const transactionCalculatedLabel = document.getElementById('transactionCalculatedLabel');
    const transactionCalculatedValue = document.getElementById('transactionCalculatedValue');
    const transactionList = document.getElementById('transactionList');
    const transactionSubmitButton = document.getElementById('transactionSubmitButton');
    const transactionCancelEditButton = document.getElementById('transactionCancelEdit');
    const purchaseFields = document.getElementById('purchaseFields');
    const saleFields = document.getElementById('saleFields');
    const recurringForm = document.getElementById('recurringForm');
    const recurringFundSelect = document.getElementById('recurringFundSelect');
    const recurringMonthlyAmountInput = document.getElementById('recurringMonthlyAmount');
    const recurringExecutionDayInput = document.getElementById('recurringExecutionDay');
    const recurringStartDateInput = document.getElementById('recurringStartDate');
    const recurringEndDateInput = document.getElementById('recurringEndDate');
    const recurringIsActiveInput = document.getElementById('recurringIsActive');
    const recurringList = document.getElementById('recurringList');
    const recurringSubmitButton = document.getElementById('recurringSubmitButton');
    const recurringCancelEditButton = document.getElementById('recurringCancelEdit');
    const holdingList = document.getElementById('holdingList');
    const portfolioAssetClassSection = document.getElementById('portfolioAssetClassSection');
    const portfolioAssetClassCards = document.getElementById('portfolioAssetClassCards');
    const portfolioTotalInvestment = document.getElementById('portfolioTotalInvestment');
    const portfolioTotalSaleAmount = document.getElementById('portfolioTotalSaleAmount');
    const portfolioRealizedGain = document.getElementById('portfolioRealizedGain');
    const portfolioRemainingInvestment = document.getElementById('portfolioRemainingInvestment');
    const portfolioValue = document.getElementById('portfolioValue');
    const portfolioUnrealizedGain = document.getElementById('portfolioUnrealizedGain');
    const portfolioTotalGain = document.getElementById('portfolioTotalGain');
    const portfolioTotalGainRate = document.getElementById('portfolioTotalGainRate');
    const portfolioToggleButton = document.getElementById('portfolioToggleButton');
    const portfolioDetails = document.getElementById('portfolioDetails');
    const recurringTransactionList = document.getElementById('recurringTransactionList');
    const message = document.getElementById('message');
    const refreshButton = document.getElementById('refreshButton');
    const portfolioToggleIcon = document.getElementById('portfolioToggleIcon');
    const portfolioToggleLabel = document.getElementById('portfolioToggleLabel');
    const lastUpdateTime = document.getElementById('lastUpdateTime');

    const listItemClass =
      'flex items-center justify-between gap-3 rounded-xl border border-slate-800 bg-slate-950/40 px-4 py-3 text-sm text-slate-100 transition hover:border-slate-700 hover:bg-slate-900/80';
    const listContentClass = 'flex flex-col gap-1 text-sm text-slate-300';
    const listActionsClass = 'flex items-center gap-2';
    const listMetaClass = 'text-xs text-slate-400 font-mono';
    const listEmptyClass = 'text-slate-400';
    const ghostButtonClass =
      'inline-flex items-center justify-center rounded-lg border border-slate-800 bg-slate-900/60 px-3 py-1.5 text-xs font-semibold text-slate-100 transition hover:bg-slate-800';
    const summaryValueBaseClass = 'mt-2 text-xl font-semibold font-mono tracking-tight';
    const summaryValueDefaultClass = `${summaryValueBaseClass} text-slate-100`;
    const summaryValueMutedClass = `${summaryValueBaseClass} text-slate-500`;
    const summaryValuePositiveClass = `${summaryValueBaseClass} text-emerald-300`;
    const summaryValueNegativeClass = `${summaryValueBaseClass} text-rose-300`;
    const summaryLabelClass = 'text-[11px] font-semibold uppercase tracking-[0.2em] text-slate-400';
    const summaryCardClass =
      'rounded-xl border border-slate-800 bg-slate-950/40 p-4 transition hover:border-slate-700';
    const calculatedValueBaseClass =
      'rounded-md border border-slate-800 bg-slate-950/50 px-3 py-2 font-mono text-sm font-medium';
    const calculatedValueMutedClass = `${calculatedValueBaseClass} text-slate-400`;
    const calculatedValueAccentClass = `${calculatedValueBaseClass} text-indigo-200`;
    const calculatedValueErrorClass = `${calculatedValueBaseClass} text-rose-300`;
    const badgeBaseClass =
      'inline-flex items-center rounded-md px-2 py-0.5 text-[10px] font-semibold uppercase tracking-[0.2em]';
    const badgeSpotClass = `${badgeBaseClass} bg-indigo-500/20 text-indigo-200`;
    const badgeRedemptionClass = `${badgeBaseClass} bg-rose-500/20 text-rose-200`;
    const badgeRecurringClass = `${badgeBaseClass} bg-emerald-500/20 text-emerald-200`;
    // 共通UIユーティリティ（common-scripts.html / window.TrustfolioUi）を参照する。
    // callApi / formatCurrency / setMessage / フォーマッタは画面間で共有している。
    const callApi = window.TrustfolioUi.callApi;
    const formatCurrency = window.TrustfolioUi.formatCurrency;
    // 旧 formatRate と同一実装（比率→パーセント表記）。
    const formatRate = window.TrustfolioUi.formatPercent;
    const getAssetClassOrder = window.TrustfolioUi.getAssetClassOrder;
    const setMessage = window.TrustfolioUi.createSetMessage(message);

    // この画面では button / input / select を無効化対象とする。
    function setLoading(isLoading) {
      window.TrustfolioUi.setLoading(isLoading, 'button, input, select');
    }

    // リスト行の操作ボタン生成は common-scripts（window.TrustfolioUi）へ集約済み。
    const createActionButton = window.TrustfolioUi.createActionButton;
    const createAssetClassBadge = window.TrustfolioUi.createAssetClassBadge;

    // 登録フォームの選択肢は共通定義から組み立てる。
    window.TrustfolioUi.populateAssetClassSelect(fundAssetClassSelect);

    /**
     * 銘柄名と資産クラスバッジを構成する要素を生成する。
     * 呼び出し側のflexコンテナへ直接追加し、同じflex要素が二重になることを防ぐ。
     *
     * @param {string} name - 銘柄名
     * @param {'equity'|'gold'|null} assetClass - 銘柄の資産クラス
     * @returns {{ success: true, value: [HTMLElement, HTMLSpanElement] } | { success: false, error: { type: 'unexpected', message: string } }}
     *   成功時は銘柄名とバッジの要素配列、失敗時はバッジ生成エラー
     */
    function createFundTitle(name, assetClass) {
      const nameElement = document.createElement('strong');
      nameElement.textContent = name;
      const badgeResult = createAssetClassBadge(assetClass);
      if (!badgeResult.success) {
        return badgeResult;
      }
      return { success: true, value: [nameElement, badgeResult.value] };
    }

    /**
     * 確認ダイアログを伴わない更新処理の共通フロー。
     * APIの成功値は後処理へ渡し、呼び出し側が追加取得なしで画面状態を更新できるようにする。
     *
     * メッセージの順序（既存の購入・売却・積立・削除フローと同一）:
     *   進行中 → 成功 → 後処理（onSuccess）。
     * 後処理側（loadFunds / reloadAfterTransactionMutation）が部分取得失敗のエラーを表示した場合や、
     * 後処理が失敗結果 { success: false, error } を返した場合は、そのエラーが成功メッセージを上書きして残る。
     * 成功メッセージを後処理の後に表示すると、後処理が表示したエラーを成功表示で隠してしまうため、
     * 必ず後処理より先に表示する。
     *
     * @param {{
     *   progressMessage: string;
     *   successMessage: string;
     *   request: object;
     *   onSuccess: (value: unknown) => Promise<void | { success: true, value?: unknown } | { success: false, error: { message: string } }>;
     * }} options - 更新処理の表示文言、APIリクエスト、成功後処理
     */
    async function runMutationFlow(options) {
      setMessage(options.progressMessage, null);
      setLoading(true);
      try {
        const response = await callApi(options.request);
        if (!response.success) {
          setMessage(response.error.message, 'error');
          return;
        }
        setMessage(options.successMessage, 'success');
        const onSuccessResult = await options.onSuccess(response.value);
        if (onSuccessResult && onSuccessResult.success === false) {
          // 後処理の失敗は成功メッセージを上書きしてエラーとして残す。
          setMessage(onSuccessResult.error.message, 'error');
        }
      } catch (error) {
        setMessage(error.message, 'error');
      } finally {
        setLoading(false);
      }
    }

    /**
     * 削除ボタン共通の実行フロー（H6 #152）。
     *
     * 取引削除・積立設定削除で完全に同型だった
     * 「confirm → 進行中メッセージ → ローディング → API 呼び出し → 失敗表示 →
     *   成功表示 → 後処理（編集解除・再読み込み） → エラー表示 → ローディング解除」
     * を一本化する。削除対象ごとの差分（文言・リクエスト・後処理）は引数で注入する。
     *
     * @param {{
     *   confirmMessage: string;
     *   progressMessage: string;
     *   successMessage: string;
     *   request: object;
     *   onSuccess: () => Promise<void>;
     * }} options
     *   - confirmMessage: 削除確認ダイアログの文言
     *   - progressMessage: 削除中に表示するメッセージ
     *   - successMessage: 削除成功時に表示するメッセージ
     *   - request: callApi へ渡す削除リクエスト
     *   - onSuccess: 削除成功後の後処理（編集モード解除・一覧再読み込み）
     */
    async function runDeleteFlow(options) {
      if (!confirm(options.confirmMessage)) {
        return;
      }
      await runMutationFlow(options);
    }

    function resetTransactionForm() {
      // テキスト系入力欄のクリアは共通ヘルパーへ委譲し、税額欄の初期値（0）復元と
      // 基準価額/計算値の表示リセットのみ手動で残す（税額欄は空文字ではなく0が初期値のため）。
      window.TrustfolioUi.resetFormFields({
        textInputs: [
          transactionDateInput,
          transactionAmountInput,
          transactionUnitsInput,
          transactionSaleAmountInput,
        ],
      });
      transactionIncomeTaxInput.value = '0';
      transactionResidentTaxInput.value = '0';
      transactionNavValue.textContent = '-';
      transactionNavValue.className = calculatedValueMutedClass;
      delete transactionNavValue.dataset.value;
      transactionCalculatedValue.textContent = '-';
      transactionCalculatedValue.className = calculatedValueMutedClass;
    }

    function setTransactionEditMode(transaction) {
      if (!transaction) {
        state.editingTransactionId = null;
        state.editingTransactionType = null;
        const transactionType = document.querySelector(
          'input[name="transactionType"]:checked'
        ).value;
        transactionSubmitButton.textContent = transactionType === 'sale' ? '売却登録' : '購入登録';
        transactionCancelEditButton.classList.add('hidden');
        resetTransactionForm();
        return;
      }

      state.editingTransactionId = transaction.id;
      state.editingTransactionType = transaction.type;
      transactionCancelEditButton.classList.remove('hidden');
      transactionFundSelect.value = transaction.fundId;
      state.selectedTransactionFundId = transaction.fundId;
      transactionDateInput.value = transaction.date;

      // 基準価額を設定
      transactionNavValue.textContent = `${transaction.navValue.toLocaleString()}円`;
      transactionNavValue.className = calculatedValueAccentClass;
      transactionNavValue.dataset.value = String(transaction.navValue);

      if (transaction.type === 'REDEMPTION') {
        // 売却取引の編集
        document.querySelector('input[name="transactionType"][value="sale"]').checked = true;
        document
          .querySelector('input[name="transactionType"][value="sale"]')
          .dispatchEvent(new Event('change'));
        transactionUnitsInput.value = String(Math.abs(transaction.units));
        transactionSaleAmountInput.value = String(transaction.amount);
        // 既存の税額未記録取引（null）は、更新時に意図せず0円記録へ変わらないよう空欄で復元する。
        transactionIncomeTaxInput.value =
          transaction.incomeTax === null ? '' : String(transaction.incomeTax);
        transactionResidentTaxInput.value =
          transaction.residentTax === null ? '' : String(transaction.residentTax);
        transactionSubmitButton.textContent = '売却内容を更新';
      } else {
        // スポット購入の編集
        document.querySelector('input[name="transactionType"][value="purchase"]').checked = true;
        document
          .querySelector('input[name="transactionType"][value="purchase"]')
          .dispatchEvent(new Event('change'));
        transactionAmountInput.value = String(transaction.amount);
        transactionSubmitButton.textContent = '購入内容を更新';
      }

      // 計算値を更新
      updateCalculatedValue();
    }

    function resetRecurringForm() {
      // 金額/実行日/開始終了日のクリアと「有効」チェックの初期化を共通ヘルパーへ委譲する。
      window.TrustfolioUi.resetFormFields({
        textInputs: [
          recurringMonthlyAmountInput,
          recurringExecutionDayInput,
          recurringStartDateInput,
          recurringEndDateInput,
        ],
        checkedInputs: [recurringIsActiveInput],
      });
    }

    function setRecurringEditMode(recurring) {
      if (!recurring) {
        state.editingRecurringId = null;
        recurringSubmitButton.textContent = '設定を追加';
        recurringCancelEditButton.classList.add('hidden');
        resetRecurringForm();
        return;
      }

      state.editingRecurringId = recurring.id;
      recurringSubmitButton.textContent = '設定内容を更新';
      recurringCancelEditButton.classList.remove('hidden');
      recurringFundSelect.value = recurring.fundId;
      recurringMonthlyAmountInput.value = String(recurring.monthlyAmount);
      recurringExecutionDayInput.value = String(recurring.executionDay);
      recurringStartDateInput.value = recurring.startDate;
      recurringEndDateInput.value = recurring.endDate ?? '';
      recurringIsActiveInput.checked = recurring.isActive;
    }

    /**
     * 銘柄一覧の描画を中断する。部分描画を残さないため一覧を空にしてから例外を投げる
     * （setMessage して続行すると初期化 IIFE の「準備ができました。」で上書きされ、エラーが見えなくなる。
     *   取得元の不整合はサーバー側で拒否されるため、ここに到達するのは UI とサーバーの契約ドリフトであり、
     *   暗黙に銘柄を落とさず起動を止める）。
     *
     * @param {string} message - 表示するエラーメッセージ
     * @returns {never}
     */
    function failFundListRender(message) {
      fundList.replaceChildren();
      throw new Error(message);
    }

    function renderFunds() {
      fundList.innerHTML = '';
      if (state.funds.length === 0) {
        const empty = document.createElement('li');
        empty.className = `${listItemClass} ${listEmptyClass}`;
        empty.textContent = '銘柄が登録されていません。';
        fundList.appendChild(empty);
        return;
      }

      state.funds.forEach((fund) => {
        const titleResult = createFundTitle(fund.name, fund.assetClass);
        if (!titleResult.success) {
          return failFundListRender(titleResult.error.message);
        }
        const titleElements = titleResult.value;
        const meta = document.createElement('span');
        meta.className = listMetaClass;
        // 基準価額の取得元を「楽天証券: <ID>」「Wealth Advisor: <コード>」「取得元未設定」の
        // 統一形式で表示する（種別の判定と文言は common-scripts.html の formatNavSourceLabel に集約）。
        const labelResult = window.TrustfolioUi.formatNavSourceLabel(fund);
        if (!labelResult.success) {
          return failFundListRender(labelResult.error.message);
        }
        meta.textContent = `${fund.createdAt.split('T')[0]} ${labelResult.value}`;
        const actions = [meta];
        const select = document.createElement('select');
        select.className =
          'rounded-lg border border-slate-800 bg-slate-950/40 px-2 py-1.5 text-xs text-slate-100 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30';
        window.TrustfolioUi.populateAssetClassSelect(select);
        select.value = fund.assetClass ?? '';
        const settingButton = createActionButton('設定', ghostButtonClass, async () => {
          if (select.value === '') {
            setMessage('資産クラスを選択してください。', 'error');
            return;
          }
          if (select.value === fund.assetClass) {
            setMessage('資産クラスは変更されていません。', 'error');
            return;
          }
          await runMutationFlow({
            progressMessage: '資産クラスを設定中...',
            successMessage: '資産クラスを設定しました。',
            request: {
              action: 'setFundAssetClass',
              id: fund.id,
              assetClass: select.value,
            },
            onSuccess: async (updatedFund) => {
              const fundIndex = state.funds.findIndex((item) => item.id === updatedFund.id);
              if (fundIndex === -1) {
                return {
                  success: false,
                  error: {
                    type: 'unexpected',
                    message: `更新対象の銘柄が画面状態に存在しません: id=${updatedFund.id}`,
                  },
                };
              }
              state.funds[fundIndex] = updatedFund;
              renderFunds();
              await loadHoldings();
            },
          });
        });
        actions.push(select, settingButton);
        const item = window.TrustfolioUi.createListItem({
          itemClass: listItemClass,
          contentClass: 'flex items-center gap-2',
          contentChildren: titleElements,
          actionsClass: listActionsClass,
          actions,
        });
        fundList.appendChild(item);
      });
    }

    function renderTransactionSelect() {
      // 取引フォームは直前に選択していた銘柄を維持する（keepSelection: true）。
      // 共通ファクトリが解決した fundId を state へ反映する（銘柄が空のときは null が返る）。
      const resolvedFundId = window.TrustfolioUi.renderFundSelect(
        transactionFundSelect,
        state.funds,
        {
          keepSelection: true,
          selectedFundId: state.selectedTransactionFundId,
        }
      );
      if (resolvedFundId) {
        state.selectedTransactionFundId = resolvedFundId;
      }
    }

    function renderRecurringSelect() {
      // 積立フォームは選択維持を行わない（option 一覧の再生成のみ）。
      window.TrustfolioUi.renderFundSelect(recurringFundSelect, state.funds);
    }

    function renderTransactions(transactions) {
      transactionList.innerHTML = '';
      if (transactions.length === 0) {
        transactionList.appendChild(
          window.TrustfolioUi.createEmptyListItem(
            '取引履歴がありません。',
            `${listItemClass} ${listEmptyClass}`
          )
        );
        return;
      }

      // 最新5件のみ表示
      const recentTransactions = transactions.slice(0, 5);

      recentTransactions.forEach((transaction) => {
        // スポット購入と売却のみ編集・削除可能（積立購入は不可）
        let actions = null;
        if (transaction.type === 'SPOT_PURCHASE' || transaction.type === 'REDEMPTION') {
          const editButton = createActionButton('編集', ghostButtonClass, () => {
            setTransactionEditMode(transaction);
          });
          const deleteLabel = transaction.type === 'REDEMPTION' ? '売却履歴' : 'スポット購入履歴';
          const deleteButton = createActionButton('削除', ghostButtonClass, () =>
            runDeleteFlow({
              confirmMessage: `${deleteLabel}を削除します。よろしいですか？`,
              progressMessage: `${deleteLabel}を削除中...`,
              successMessage: `${deleteLabel}を削除しました。`,
              // 削除対象の取引が属する銘柄IDを必ず送信する（サーバ側は fundId から取引シートを特定するため）。
              request: {
                action: 'deleteSpotPurchase',
                id: transaction.id,
                fundId: transaction.fundId,
              },
              onSuccess: async () => {
                if (state.editingTransactionId === transaction.id) {
                  setTransactionEditMode(null);
                }
                await reloadAfterTransactionMutation(state.selectedTransactionFundId);
              },
            })
          );
          actions = [editButton, deleteButton];
        }

        const item = window.TrustfolioUi.createTransactionItem(transaction, {
          itemClass: listItemClass,
          contentClass: listContentClass,
          headerClass: 'flex items-center gap-2 text-sm text-slate-200',
          detailClass: 'text-xs text-slate-400',
          badgeSpotClass,
          badgeRedemptionClass,
          badgeRecurringClass,
          actionsClass: listActionsClass,
          actions,
        });
        transactionList.appendChild(item);
      });
    }

    function renderRecurringList(recurrings) {
      recurringList.innerHTML = '';
      if (recurrings.length === 0) {
        recurringList.appendChild(
          window.TrustfolioUi.createEmptyListItem(
            '積立設定がありません。',
            `${listItemClass} ${listEmptyClass}`
          )
        );
        return;
      }

      recurrings.forEach((recurring) => {
        const fund = state.funds.find((f) => f.id === recurring.fundId);
        const fundName = fund ? fund.name : '不明な銘柄';

        // 銘柄名
        const fundNameElement = document.createElement('div');
        fundNameElement.className = 'text-sm font-medium text-slate-100';
        fundNameElement.textContent = fundName;

        // 積立設定詳細
        const title = document.createElement('strong');
        title.textContent = `${recurring.monthlyAmount.toLocaleString()}円 / 毎月${recurring.executionDay}日注文`;

        const detail = document.createElement('span');
        detail.className = 'text-xs text-slate-400';
        const period = recurring.endDate
          ? `${recurring.startDate}〜${recurring.endDate}`
          : recurring.startDate;
        const status = recurring.isActive ? 'アクティブ' : '停止中';
        detail.textContent = `${period} / ${status}`;

        const editButton = createActionButton('編集', ghostButtonClass, () => {
          setRecurringEditMode(recurring);
        });
        const deleteButton = createActionButton('削除', ghostButtonClass, () =>
          runDeleteFlow({
            confirmMessage: '積立設定を削除します。よろしいですか？',
            progressMessage: '積立設定を削除中...',
            successMessage: '積立設定を削除しました。',
            request: { action: 'deleteRecurringPurchase', id: recurring.id },
            onSuccess: async () => {
              if (state.editingRecurringId === recurring.id) {
                setRecurringEditMode(null);
              }
              await loadRecurringPurchases();
            },
          })
        );

        // 外枠（li > content + actions）は共通ファクトリへ委譲する。
        const item = window.TrustfolioUi.createListItem({
          itemClass: listItemClass,
          contentClass: listContentClass,
          contentChildren: [fundNameElement, title, detail],
          actionsClass: listActionsClass,
          actions: [editButton, deleteButton],
        });
        recurringList.appendChild(item);
      });
    }

    /**
     * 保有一覧を資産クラス順に描画する。
     * 資産クラスやタイトルの不整合時は部分描画せず一覧を空にしてErrorを送出し、データ不整合を隠さない。
     */
    function renderHoldings(holdings) {
      holdingList.innerHTML = '';
      if (holdings.length === 0) {
        const empty = document.createElement('li');
        empty.className = `${listItemClass} ${listEmptyClass}`;
        empty.textContent = '保有情報がありません。';
        holdingList.appendChild(empty);
        return;
      }

      // 資産クラスの表示順（株式 → 金 → 未設定）で安定ソートし、同じ区分内では元の配列順を維持する。
      // 順位を解決できない保有は部分描画せず、一覧を空にして失敗させる。
      const orderedHoldings = holdings.map((holding) => {
        const orderResult = getAssetClassOrder(holding.assetClass);
        if (!orderResult.success) {
          holdingList.replaceChildren();
          throw new Error(orderResult.error.message);
        }
        return { holding, order: orderResult.value };
      });
      orderedHoldings
        .sort((a, b) => a.order - b.order)
        .forEach(({ holding }) => {
          const titleResult = createFundTitle(holding.fundName, holding.assetClass);
          if (!titleResult.success) {
            holdingList.replaceChildren();
            throw new Error(titleResult.error.message);
          }
          const titleElements = titleResult.value;
          const detail = document.createElement('span');
          detail.className = 'text-right text-sm text-slate-300 min-w-[200px]';

          if (holding.currentValue === null) {
            detail.textContent = `${holding.totalUnits.toLocaleString()}口 / NAV未登録`;
          } else {
            const valueText = formatCurrency(holding.currentValue);
            const gainText =
              holding.unrealizedGain !== null ? formatCurrency(holding.unrealizedGain) : '-';
            const rateText =
              holding.unrealizedGainRate !== null ? formatRate(holding.unrealizedGainRate) : '-';
            const gainClass =
              holding.unrealizedGain !== null && holding.unrealizedGain >= 0
                ? 'text-emerald-300'
                : 'text-rose-300';
            detail.innerHTML = `${holding.totalUnits.toLocaleString()}口 / ${valueText}<br><span class="${gainClass}">${gainText} (${rateText})</span>`;
          }

          const item = window.TrustfolioUi.createListItem({
            itemClass: listItemClass,
            contentClass: 'flex items-center gap-2',
            contentChildren: titleElements,
            actionsClass: listActionsClass,
            actions: [detail],
          });
          holdingList.appendChild(item);
        });
    }

    /**
     * 資産クラス別カードを全件検証後に描画する。
     * バッジ生成に失敗した場合はセクションを隠し、Errorを呼び出し元へ伝播させる。
     * 一部だけ表示するとデータ不整合を成功表示で覆い隠すため、カードは全件成功時だけ追加する。
     */
    function renderAssetClassSummaries(summaries) {
      const cards = summaries.map((summary) => {
        const badgeResult = createAssetClassBadge(summary.assetClass);
        if (!badgeResult.success) {
          portfolioAssetClassSection.classList.add('hidden');
          throw new Error(badgeResult.error.message);
        }
        const card = document.createElement('div');
        card.className = summaryCardClass;
        const heading = document.createElement('div');
        heading.appendChild(badgeResult.value);
        card.appendChild(heading);
        const alwaysVisible = document.createElement('div');
        alwaysVisible.className = 'mt-4 grid gap-3';
        appendSummaryField(
          alwaysVisible,
          '残存投資額',
          formatCurrency(summary.remainingInvestment),
          summaryValueDefaultClass
        );
        appendSummaryField(
          alwaysVisible,
          '評価額',
          summary.totalCurrentValue === null
            ? 'NAV未登録'
            : formatCurrency(summary.totalCurrentValue),
          summary.totalCurrentValue === null ? summaryValueMutedClass : summaryValueDefaultClass
        );
        appendSummaryField(
          alwaysVisible,
          '損益（損益率）',
          summary.totalUnrealizedGain === null
            ? '-'
            : `${formatCurrency(summary.totalUnrealizedGain)} (${formatRate(summary.totalUnrealizedGainRate)})`,
          getGainClass(summary.totalUnrealizedGain)
        );
        appendSummaryField(
          alwaysVisible,
          '評価額構成比',
          summary.allocationRate === null ? '-' : formatRate(summary.allocationRate),
          summaryValueDefaultClass
        );
        appendSummaryField(
          alwaysVisible,
          '銘柄数',
          `${summary.holdingCount}銘柄`,
          summaryValueDefaultClass
        );
        card.appendChild(alwaysVisible);
        const details = document.createElement('div');
        details.className = 'portfolio-asset-class-detail mt-3 grid gap-2';
        // 再描画時も全体詳細の開閉状態を引き継ぎ、区分詳細とトグル表示を同期させる。
        details.classList.toggle('hidden', portfolioDetails.classList.contains('hidden'));
        appendSummaryField(
          details,
          '累計投入額',
          formatCurrency(summary.totalInvestment),
          summaryValueDefaultClass
        );
        appendSummaryField(
          details,
          '総損益',
          summary.totalGain === null ? '-' : formatCurrency(summary.totalGain),
          getGainClass(summary.totalGain)
        );
        appendSummaryField(
          details,
          '総損益率',
          summary.totalGainRate === null ? '-' : formatRate(summary.totalGainRate),
          getGainClass(summary.totalGainRate)
        );
        appendSummaryField(
          details,
          '売却総額',
          formatCurrency(summary.totalSaleAmount),
          summaryValueDefaultClass
        );
        appendSummaryField(
          details,
          '実現損益',
          formatCurrency(summary.realizedGain),
          getGainClass(summary.realizedGain)
        );
        card.appendChild(details);
        if (summary.assetClass === null) {
          const note = document.createElement('p');
          note.className = 'mt-3 text-xs text-amber-300';
          note.textContent =
            '資産クラスが未設定の銘柄があります。ポートフォリオタブの投資信託セクションで設定してください。';
          card.appendChild(note);
        }
        return card;
      });
      portfolioAssetClassCards.replaceChildren(...cards);
      // 成功したカードを描画した後にだけ、空配列かどうかでセクション表示を決定する。
      portfolioAssetClassSection.classList.toggle('hidden', summaries.length === 0);
    }

    /** サマリー項目のラベルと値をカードへ追加する。値の表示形式は呼び出し元が決定する。 */
    function appendSummaryField(container, label, value, valueClass) {
      const field = document.createElement('div');
      const labelElement = document.createElement('p');
      labelElement.className = summaryLabelClass;
      labelElement.textContent = label;
      const valueElement = document.createElement('p');
      valueElement.className = valueClass;
      valueElement.textContent = value;
      field.append(labelElement, valueElement);
      container.appendChild(field);
    }

    /** 損益値に対応する表示クラスを返す。nullは未登録値用のクラスにする。 */
    function getGainClass(value) {
      if (value === null) return summaryValueMutedClass;
      return value >= 0 ? summaryValuePositiveClass : summaryValueNegativeClass;
    }

    function renderPortfolioSummary(portfolio) {
      // 残存投資額
      portfolioRemainingInvestment.textContent = formatCurrency(portfolio.remainingInvestment);
      portfolioRemainingInvestment.className = summaryValueDefaultClass;

      // 累計投入額
      portfolioTotalInvestment.textContent = formatCurrency(portfolio.totalInvestment);
      portfolioTotalInvestment.className = summaryValueDefaultClass;

      // 売却総額
      portfolioTotalSaleAmount.textContent = formatCurrency(portfolio.totalSaleAmount);
      portfolioTotalSaleAmount.className = summaryValueDefaultClass;

      // 実現損益
      portfolioRealizedGain.textContent = formatCurrency(portfolio.realizedGain);
      portfolioRealizedGain.className = getGainClass(portfolio.realizedGain);

      if (portfolio.totalCurrentValue === null) {
        portfolioValue.textContent = 'NAV未登録';
        portfolioValue.className = summaryValueMutedClass;
        portfolioUnrealizedGain.textContent = '-';
        portfolioUnrealizedGain.className = summaryValueMutedClass;
        portfolioTotalGain.textContent = '-';
        portfolioTotalGain.className = summaryValueMutedClass;
        portfolioTotalGainRate.textContent = '-';
        portfolioTotalGainRate.className = summaryValueMutedClass;
        return;
      }

      // 評価額
      portfolioValue.textContent = formatCurrency(portfolio.totalCurrentValue);
      portfolioValue.className = summaryValueDefaultClass;

      // 損益（損益率）
      const unrealizedGainText = formatCurrency(portfolio.totalUnrealizedGain);
      const unrealizedGainRateText = formatRate(portfolio.totalUnrealizedGainRate);
      portfolioUnrealizedGain.textContent = `${unrealizedGainText} (${unrealizedGainRateText})`;
      portfolioUnrealizedGain.className = getGainClass(portfolio.totalUnrealizedGain);

      // 総損益
      portfolioTotalGain.textContent = formatCurrency(portfolio.totalGain);
      portfolioTotalGain.className = getGainClass(portfolio.totalGain);

      // 総損益率
      portfolioTotalGainRate.textContent = formatRate(portfolio.totalGainRate);
      portfolioTotalGainRate.className = getGainClass(portfolio.totalGainRate);
    }

    async function loadFunds() {
      const response = await callApi({ action: 'listFunds' });
      if (!response.success) {
        throw new Error(response.error.message);
      }
      state.funds = response.value;
      renderFunds();
      renderTransactionSelect();
      renderRecurringSelect();

      // 並列API呼び出し
      const results = await Promise.allSettled([
        state.selectedTransactionFundId
          ? loadTransactions(state.selectedTransactionFundId)
          : Promise.resolve(),
        loadRecurringPurchases(),
        loadHoldings(),
        loadPortfolioSummary(),
        loadRecurringTransactionHistory(),
      ]);

      // 失敗したAPIのエラーメッセージを集約
      const errors = results
        .filter((r) => r.status === 'rejected')
        .map((r) => r.reason?.message || '不明なエラー');

      if (errors.length > 0) {
        setMessage(`一部のデータ取得に失敗しました: ${errors.join(', ')}`, 'error');
      }
    }

    async function loadTransactions(fundId) {
      const response = await callApi({ action: 'getTransactionHistory', fundId });
      if (!response.success) {
        throw new Error(response.error.message);
      }
      renderTransactions(response.value);
    }

    async function loadRecurringPurchases() {
      const response = await callApi({ action: 'listRecurringPurchases' });
      if (!response.success) {
        throw new Error(response.error.message);
      }
      renderRecurringList(response.value);
    }

    async function loadHoldings() {
      const response = await callApi({ action: 'listHoldings' });
      if (!response.success) {
        throw new Error(response.error.message);
      }
      renderHoldings(response.value);
    }

    async function loadPortfolioSummary() {
      const response = await callApi({ action: 'getPortfolioSummary' });
      if (!response.success) {
        throw new Error(response.error.message);
      }
      renderPortfolioSummary(response.value);
      renderAssetClassSummaries(response.value.assetClassSummaries);
    }

    async function loadRecurringTransactionHistory() {
      const response = await callApi({ action: 'listAllTransactions' });
      if (!response.success) {
        throw new Error(response.error.message);
      }
      renderRecurringTransactionHistory(response.value);
    }

    /**
     * 取引の登録・更新・削除の成功後に、取引データに依存する表示を再読込する。
     *
     * 対象は「銘柄別の取引履歴」「保有情報」「ポートフォリオサマリー」
     * 「全銘柄の取引履歴」の4つで、相互に依存しないため loadFunds と同じ
     * Promise.allSettled パターンで並列に取得する。
     * 一部の取得が失敗しても残りの表示は更新し、失敗分はエラーメッセージに集約する。
     *
     * @param fundId 銘柄別の取引履歴を再読込する対象のファンドID
     */
    async function reloadAfterTransactionMutation(fundId) {
      const results = await Promise.allSettled([
        loadTransactions(fundId),
        loadHoldings(),
        loadPortfolioSummary(),
        loadRecurringTransactionHistory(),
      ]);

      const errors = results
        .filter((r) => r.status === 'rejected')
        .map((r) => r.reason?.message || '不明なエラー');

      if (errors.length > 0) {
        setMessage(`一部のデータ取得に失敗しました: ${errors.join(', ')}`, 'error');
      }
    }

    function renderRecurringTransactionHistory(allTransactions) {
      recurringTransactionList.innerHTML = '';

      // 最新10件を取得（全ての取引種別を含む）
      const recentTransactions = allTransactions.slice(0, 10);

      if (recentTransactions.length === 0) {
        recurringTransactionList.appendChild(
          window.TrustfolioUi.createEmptyListItem(
            '取引履歴がありません。',
            `${listItemClass} ${listEmptyClass}`
          )
        );
        return;
      }

      recentTransactions.forEach((transaction) => {
        const fund = state.funds.find((f) => f.id === transaction.fundId);
        const fundName = fund ? fund.name : '不明な銘柄';

        // 取引一覧との違いは「ヘッダーに mb-1 余白」「銘柄名 div を挿入」「操作ボタン無し」のみ。
        const item = window.TrustfolioUi.createTransactionItem(transaction, {
          itemClass: listItemClass,
          contentClass: listContentClass,
          headerClass: 'mb-1 flex items-center gap-2 text-sm text-slate-200',
          detailClass: 'text-xs text-slate-400',
          badgeSpotClass,
          badgeRedemptionClass,
          badgeRecurringClass,
          fundName,
          fundNameClass: 'text-sm font-medium text-slate-100',
        });
        recurringTransactionList.appendChild(item);
      });
    }

    fundForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const name = fundNameInput.value;
      const assetClass = fundAssetClassSelect.value;
      const kind = fundNavSourceKindSelect.value;
      const group = navSourceInputGroups.find((candidate) => candidate.kind === kind);
      // 'none' は入力欄を持たないため code には空文字を渡す（buildNavSourceFields は none で code を使わない）。
      const navSourceFieldsResult = window.TrustfolioUi.buildNavSourceFields(
        kind,
        group === undefined ? '' : group.input.value.trim()
      );
      if (!navSourceFieldsResult.success) {
        setMessage(navSourceFieldsResult.error.message, 'error');
        return;
      }
      const navSourceFields = navSourceFieldsResult.value;
      const settlementBusinessDaysText = fundSettlementBusinessDaysInput.value.trim();
      const settlementBusinessDays =
        settlementBusinessDaysText === '' ? null : Number(settlementBusinessDaysText);
      await runMutationFlow({
        progressMessage: '登録中...',
        successMessage: '銘柄を登録しました。',
        request: {
          action: 'createFund',
          name,
          rakutenFundId: navSourceFields.rakutenFundId,
          settlementBusinessDays,
          navSource: navSourceFields.navSource,
          navSourceCode: navSourceFields.navSourceCode,
          assetClass,
        },
        onSuccess: async () => {
          window.TrustfolioUi.resetFormFields({
            textInputs: [fundNameInput, fundAssetClassSelect, fundSettlementBusinessDaysInput],
          });
          fundNavSourceKindSelect.value = window.TrustfolioUi.NAV_SOURCE_KINDS.NONE;
          applyNavSourceKindToForm();
          await loadFunds();
        },
      });
    });

    // 取引種別ラジオボタンの切り替え処理
    const transactionTypeRadios = document.querySelectorAll('input[name="transactionType"]');
    transactionTypeRadios.forEach((radio) => {
      radio.addEventListener('change', (event) => {
        const transactionType = event.target.value;
        if (transactionType === 'purchase') {
          // 購入モード
          purchaseFields.classList.remove('hidden');
          saleFields.classList.add('hidden');
          transactionCalculatedLabel.textContent = '取得口数（自動計算）';
          transactionCalculatedLabel.parentElement.classList.remove('hidden');
          transactionSubmitButton.textContent = '購入登録';
          transactionAmountInput.required = true;
          transactionUnitsInput.required = false;
          transactionSaleAmountInput.required = false;
          transactionIncomeTaxInput.required = false;
          transactionResidentTaxInput.required = false;
          transactionUnitsInput.value = '';
          transactionSaleAmountInput.value = '';
          transactionIncomeTaxInput.value = '0';
          transactionResidentTaxInput.value = '0';
        } else {
          // 売却モード
          purchaseFields.classList.add('hidden');
          saleFields.classList.remove('hidden');
          // 売却モードでは自動計算表示を非表示
          transactionCalculatedLabel.parentElement.classList.add('hidden');
          transactionSubmitButton.textContent = '売却登録';
          transactionAmountInput.required = false;
          transactionUnitsInput.required = true;
          transactionSaleAmountInput.required = true;
          transactionIncomeTaxInput.required = true;
          transactionResidentTaxInput.required = true;
          transactionAmountInput.value = '';
        }
        updateCalculatedValue();
      });
    });

    // 基準価額を自動取得する
    async function fetchNavForDate() {
      const fundId = transactionFundSelect.value;
      const date = transactionDateInput.value;

      if (!fundId || !date) {
        transactionNavValue.textContent = '-';
        transactionNavValue.className = calculatedValueMutedClass;
        updateCalculatedValue();
        return;
      }

      try {
        const response = await callApi({
          action: 'getNavHistory',
          fundId,
        });

        if (!response.success) {
          transactionNavValue.textContent = 'エラー';
          transactionNavValue.className = calculatedValueErrorClass;
          updateCalculatedValue();
          return;
        }

        // 指定日付の基準価額を探す
        const nav = response.value.find((n) => n.date === date);
        if (nav) {
          transactionNavValue.textContent = `${nav.value.toLocaleString()}円`;
          transactionNavValue.className = calculatedValueAccentClass;
          transactionNavValue.dataset.value = String(nav.value);
        } else {
          transactionNavValue.textContent = '未記録';
          transactionNavValue.className = calculatedValueErrorClass;
          delete transactionNavValue.dataset.value;
        }
        updateCalculatedValue();
      } catch (error) {
        transactionNavValue.textContent = 'エラー';
        transactionNavValue.className = calculatedValueErrorClass;
        delete transactionNavValue.dataset.value;
        updateCalculatedValue();
      }
    }

    // 購入時は口数を計算、売却時は金額を計算
    function updateCalculatedValue() {
      const transactionType = document.querySelector('input[name="transactionType"]:checked').value;
      const navValue = Number(transactionNavValue.dataset.value || 0);

      if (!navValue || navValue <= 0) {
        transactionCalculatedValue.textContent = '-';
        transactionCalculatedValue.className = calculatedValueMutedClass;
        return;
      }

      // 【入力中のプレビュー表示】ここで計算する口数・金額は画面表示のみに使い、
      // この値がそのままサーバーへ送信されることはない。取引種別ごとの位置づけは以下のとおり:
      //   - 購入（購入金額→取得口数）: 保存される口数はサーバー側
      //     domain/PurchaseCalculator.ts の calculateUnits が計算する。利用者が
      //     プレビューと保存値の食い違いを目にしないよう、丸め方式を calculateUnits と
      //     厳密に一致させて Math.ceil（切り上げ）を用いる。calculateUnits の丸め方式を
      //     変更する際は、必ず本箇所も同時に更新すること。
      //   - 売却（売却口数→売却金額）: 保存される売却金額は利用者が「売却金額」欄へ
      //     手入力した値であり、ここでの計算結果は保存されない（usecase/TransactionUseCase.ts の
      //     売却登録・更新処理は、同等の計算を行う domain/PurchaseCalculator.ts の
      //     calculateValue を用いず、手入力値をそのまま保存する）。したがってこの金額は
      //     入力の目安を示す参考値であり、丸め方式を保存値に合わせる必要はない。
      // 係数 10000 は投資信託の基準価額が「1万口あたりの価額」である慣行に基づく
      // （サーバー側の UNITS_BASE と同義）。
      const UNITS_BASE = 10000;

      if (transactionType === 'purchase') {
        // 購入金額から取得口数を算出（サーバー側 calculateUnits と同じ Math.ceil で切り上げる）
        const amount = Number(transactionAmountInput.value || 0);
        if (amount > 0) {
          const units = Math.ceil((amount / navValue) * UNITS_BASE);
          transactionCalculatedValue.textContent = `${units.toLocaleString()}口`;
          transactionCalculatedValue.className = calculatedValueAccentClass;
        } else {
          transactionCalculatedValue.textContent = '-';
          transactionCalculatedValue.className = calculatedValueMutedClass;
        }
      } else {
        // 売却口数から売却金額の参考値を算出する（保存値は利用者の手入力のため参考表示）
        const units = Number(transactionUnitsInput.value || 0);
        if (units > 0) {
          const amount = Math.round((units / UNITS_BASE) * navValue);
          transactionCalculatedValue.textContent = `${amount.toLocaleString()}円`;
          transactionCalculatedValue.className = calculatedValueAccentClass;
        } else {
          transactionCalculatedValue.textContent = '-';
          transactionCalculatedValue.className = calculatedValueMutedClass;
        }
      }
    }

    // 日付・銘柄変更時に基準価額を取得
    transactionFundSelect.addEventListener('change', fetchNavForDate);
    transactionDateInput.addEventListener('change', fetchNavForDate);

    // 購入金額または売却口数変更時に計算値を更新
    transactionAmountInput.addEventListener('input', updateCalculatedValue);
    transactionUnitsInput.addEventListener('input', updateCalculatedValue);

    transactionForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const transactionType = document.querySelector('input[name="transactionType"]:checked').value;
      const fundId = transactionFundSelect.value;
      const date = transactionDateInput.value;
      const navValue = Number(transactionNavValue.dataset.value || 0);
      const isEditing = Boolean(state.editingTransactionId);

      // 基準価額の検証
      if (!navValue || navValue <= 0) {
        setMessage('指定した約定日の基準価額が記録されていません。', 'error');
        return;
      }

      if (transactionType === 'purchase') {
        // 購入金額から取引を実行
        const amount = Number(transactionAmountInput.value);
        await runMutationFlow({
          progressMessage: isEditing ? 'スポット購入を更新中...' : '購入登録中...',
          successMessage: isEditing
            ? 'スポット購入の内容を更新しました。'
            : 'スポット購入を登録しました。',
          request: isEditing
            ? {
                action: 'updateSpotPurchase',
                id: state.editingTransactionId,
                fundId,
                date,
                amount,
                navValue,
              }
            : {
                action: 'executeSpotPurchase',
                fundId,
                date,
                amount,
                navValue,
              },
          onSuccess: async () => {
            setTransactionEditMode(null);
            await reloadAfterTransactionMutation(fundId);
          },
        });
      } else {
        // 売却口数と売却金額から取引を実行
        const units = Number(transactionUnitsInput.value);
        const amount = Number(transactionSaleAmountInput.value);
        const incomeTaxText = transactionIncomeTaxInput.value.trim();
        const residentTaxText = transactionResidentTaxInput.value.trim();
        const incomeTax = Number(incomeTaxText);
        const residentTax = Number(residentTaxText);
        if (
          incomeTaxText === '' ||
          residentTaxText === '' ||
          !Number.isFinite(incomeTax) ||
          !Number.isFinite(residentTax) ||
          incomeTax < 0 ||
          residentTax < 0
        ) {
          setMessage('所得税と住民税は0以上の数値で入力してください。', 'error');
          return;
        }
        await runMutationFlow({
          progressMessage: isEditing ? '売却を更新中...' : '売却登録中...',
          successMessage: isEditing ? '売却の内容を更新しました。' : '売却を登録しました。',
          request: isEditing
            ? {
                action: 'updateSaleTransaction',
                id: state.editingTransactionId,
                fundId,
                date,
                units,
                amount,
                navValue,
                incomeTax,
                residentTax,
              }
            : {
                action: 'executeSale',
                fundId,
                date,
                units,
                amount,
                navValue,
                incomeTax,
                residentTax,
              },
          onSuccess: async () => {
            if (isEditing) {
              setTransactionEditMode(null);
            } else {
              transactionForm.reset();
              // 購入モードに戻す
              document.querySelector('input[name="transactionType"][value="purchase"]').checked =
                true;
              transactionTypeRadios[0].dispatchEvent(new Event('change'));
            }
            await reloadAfterTransactionMutation(fundId);
          },
        });
      }
    });

    transactionCancelEditButton.addEventListener('click', () => {
      setTransactionEditMode(null);
    });

    recurringForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const fundId = recurringFundSelect.value;
      const monthlyAmount = Number(recurringMonthlyAmountInput.value);
      const executionDay = Number(recurringExecutionDayInput.value);
      const startDate = recurringStartDateInput.value;
      const endDate = recurringEndDateInput.value || null;
      const isActive = recurringIsActiveInput.checked;
      const isEditing = Boolean(state.editingRecurringId);
      await runMutationFlow({
        progressMessage: isEditing ? '積立設定を更新中...' : '積立設定を登録中...',
        successMessage: isEditing ? '積立設定を更新しました。' : '積立設定を追加しました。',
        request: isEditing
          ? {
              action: 'updateRecurringPurchase',
              id: state.editingRecurringId,
              fundId,
              monthlyAmount,
              executionDay,
              startDate,
              endDate,
              isActive,
            }
          : {
              action: 'createRecurringPurchase',
              fundId,
              monthlyAmount,
              executionDay,
              startDate,
              endDate,
              isActive,
            },
        onSuccess: async () => {
          setRecurringEditMode(null);
          await loadRecurringPurchases();
        },
      });
    });

    recurringCancelEditButton.addEventListener('click', () => {
      setRecurringEditMode(null);
    });

    transactionFundSelect.addEventListener('change', async (event) => {
      const fundId = event.target.value;
      state.selectedTransactionFundId = fundId;
      if (!fundId) {
        renderTransactions([]);
        return;
      }
      try {
        await loadTransactions(fundId);
      } catch (error) {
        setMessage(error.message, 'error');
      }
    });

    refreshButton.addEventListener('click', async () => {
      await performRefresh();
    });

    // ポートフォリオ詳細のトグル
    portfolioToggleButton.addEventListener('click', () => {
      const isHidden = portfolioDetails.classList.contains('hidden');
      if (isHidden) {
        portfolioDetails.classList.remove('hidden');
        portfolioToggleIcon.classList.add('rotate-180');
        portfolioToggleLabel.textContent = '詳細を非表示';
      } else {
        portfolioDetails.classList.add('hidden');
        portfolioToggleIcon.classList.remove('rotate-180');
        portfolioToggleLabel.textContent = '詳細を表示';
      }
      document
        .querySelectorAll('.portfolio-asset-class-detail')
        .forEach((element) => element.classList.toggle('hidden', !isHidden));
    });

    // タブ切り替え
    const tabButtons = document.querySelectorAll('.tab-button');
    const tabContents = document.querySelectorAll('.tab-content');

    function switchTab(tabName) {
      // タブボタンの状態更新
      tabButtons.forEach((button) => {
        if (button.getAttribute('data-tab') === tabName) {
          button.setAttribute('data-active', 'true');
        } else {
          button.setAttribute('data-active', 'false');
        }
      });

      // タブコンテンツの表示/非表示
      tabContents.forEach((content) => {
        if (content.getAttribute('data-tab') === tabName) {
          content.classList.remove('hidden');
        } else {
          content.classList.add('hidden');
        }
      });

      // タブにデータローダーが登録されていれば呼び出す（H6 #152: 明示的な登録 API 経由。
      // performance-scripts.html が読み込み時に登録する。未登録はスクリプト読み込み失敗の
      // 異常系のため、エラーとして記録する）
      const loader = window.TrustfolioUi.getTabDataLoader(tabName);
      if (loader !== null) {
        loader();
      } else if (tabName === 'performance') {
        console.error('[Tab] performance タブのデータローダーが未登録です。');
      }
    }

    // タブボタンのクリックイベント
    tabButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const tabName = button.getAttribute('data-tab');
        switchTab(tabName);
      });
    });

    // ========================================
    // 日次自動リフレッシュ機能
    // ========================================

    // localStorageキー
    const LAST_REFRESH_DATE_KEY = 'trustfolio_last_refresh_date';
    const LAST_UPDATE_TIME_KEY = 'trustfolio_last_update_time';

    /**
     * 最終更新時刻を表示形式で更新
     */
    function updateLastUpdateTimeDisplay() {
      const lastUpdate = localStorage.getItem(LAST_UPDATE_TIME_KEY);
      if (lastUpdate) {
        // 日時整形は共有ヘルパーへ集約済み（H6 #152。出力形式は従来と同一）
        lastUpdateTime.textContent = `最終更新: ${window.TrustfolioUi.formatShortDateTime(lastUpdate)}`;
      } else {
        lastUpdateTime.textContent = '-';
      }
    }

    /**
     * 最終更新時刻を記録
     */
    function recordUpdateTime() {
      const now = new Date().toISOString();
      localStorage.setItem(LAST_UPDATE_TIME_KEY, now);
      updateLastUpdateTimeDisplay();
    }

    /**
     * その日初回のリフレッシュかどうかをチェック
     * @returns {boolean} リフレッシュが必要な場合はtrue
     */
    function shouldRefreshToday() {
      const today = window.TrustfolioUi.getLocalDateString();
      const lastRefreshDate = localStorage.getItem(LAST_REFRESH_DATE_KEY);

      if (lastRefreshDate !== today) {
        localStorage.setItem(LAST_REFRESH_DATE_KEY, today);
        return true;
      }
      return false;
    }

    /**
     * データを再読み込み
     */
    async function performRefresh() {
      // 現在アクティブなタブを確認
      const activeTab = document.querySelector('.tab-content:not(.hidden)');
      const activeTabName = activeTab ? activeTab.getAttribute('data-tab') : 'portfolio';

      if (activeTabName === 'performance') {
        // パフォーマンスタブの場合、登録済みローダー経由でデータを再読み込み（H6 #152）
        try {
          const loader = window.TrustfolioUi.getTabDataLoader('performance');
          if (loader !== null) {
            loader();
            recordUpdateTime();
          } else {
            console.warn('[Refresh] performance タブのデータローダーが未登録です。');
          }
        } catch (error) {
          console.error('[Refresh] Performance data reload failed:', error);
          setMessage('パフォーマンスデータの再読み込みに失敗しました。', 'error');
        }
      } else {
        // ポートフォリオタブの場合、ポートフォリオデータを再読み込み
        setMessage('再読み込み中...', null);
        setLoading(true);
        try {
          await loadFunds();
          recordUpdateTime();
          setMessage('最新の情報を取得しました。', 'success');
        } catch (error) {
          setMessage(error.message, 'error');
        } finally {
          setLoading(false);
        }
      }
    }

    // 初期化時に最終更新時刻を表示
    updateLastUpdateTimeDisplay();

    (async () => {
      setMessage('読み込み中...', null);
      setLoading(true);

      // 日次リフレッシュが必要かチェック
      const needsRefresh = shouldRefreshToday();

      try {
        window.TrustfolioUi.populateNavSourceKindSelect(fundNavSourceKindSelect);
        fundNavSourceKindSelect.addEventListener('change', applyNavSourceKindToForm);
        // change は blur まで発火しないため、確認完了後に入力欄内で編集すると古い結果が残る。
        // input でも結果を消去し、編集中のコードを確認済みと誤認させない。
        fundNavSourceCodeInput.addEventListener('input', () => {
          setNavSourceCodeCheckMessage('', null);
        });
        fundNavSourceCodeInput.addEventListener('change', () => {
          // 入力値が変わった時点で直前の確認結果は無効になるため、結果表示を消去する。
          setNavSourceCodeCheckMessage('', null);
          // URL文字列は pattern="[^/]+/[^/]+" に合致せず、制約検証で送信がブロックされる。
          // change は submit より先に発火するため、ブラウザの制約検証前に変換を完了させる。
          const navSourceCode = window.TrustfolioUi.extractWealthAdvisorNavSourceCode(
            fundNavSourceCodeInput.value
          );
          if (navSourceCode !== null) fundNavSourceCodeInput.value = navSourceCode;
        });
        fundNavSourceCodeCheckButton.addEventListener('click', async () => {
          // setLoading(false)は全ボタンを再有効化するため、disabled状態に依存せず多重実行を防ぐ。
          if (isNavSourceCodeCheckInFlight) {
            setNavSourceCodeCheckMessage('確認中です。完了までお待ちください。', 'error');
            return;
          }
          const requestedNavSourceCode = fundNavSourceCodeInput.value.trim();
          /**
           * 現在の入力と確認を依頼したコードが異なる場合に、古い応答の結果表示を消去する。
           * 通信完了後も「確認中...」が残り、処理中と誤表示されることを防ぐ。
           * 成功応答と通信例外の双方で、結果の解釈や整形より先に呼び出す。
           * @returns {boolean} 応答を破棄した場合はtrue、現在の入力に対応する場合はfalse。
           */
          const discardOutdatedResponse = () => {
            if (fundNavSourceCodeInput.value.trim() === requestedNavSourceCode) return false;
            setNavSourceCodeCheckMessage('', null);
            return true;
          };
          if (!requestedNavSourceCode) {
            setNavSourceCodeCheckMessage('取得元コードを入力してください。', 'error');
            return;
          }
          if (
            Date.now() - lastNavSourceCodeCheckStartedAt <
            NAV_SOURCE_CODE_CHECK_MIN_INTERVAL_MS
          ) {
            setNavSourceCodeCheckMessage(
              `確認の実行間隔は${NAV_SOURCE_CODE_CHECK_MIN_INTERVAL_MS / 1000}秒以上あけてください。`,
              'error'
            );
            return;
          }
          lastNavSourceCodeCheckStartedAt = Date.now();
          isNavSourceCodeCheckInFlight = true;
          fundNavSourceCodeCheckButton.disabled = true;
          setNavSourceCodeCheckMessage('確認中...', null);
          try {
            const response = await window.TrustfolioUi.callApi({
              action: 'checkWealthAdvisorNavSource',
              navSourceCode: requestedNavSourceCode,
            });
            if (discardOutdatedResponse()) return;
            if (response.success === false) {
              setNavSourceCodeCheckMessage(response.error.message, 'error');
            } else if (response.value.nav === null) {
              // ページ取得と基準価額取得は別の状態であり、抽出不可を成功表示にしない。
              setNavSourceCodeCheckMessage(
                `ページは取得できましたが（HTTP ${response.value.statusCode}）、基準価額を抽出できませんでした。URL: ${response.value.url}`,
                'error'
              );
            } else {
              const nav = response.value.nav;
              setNavSourceCodeCheckMessage(
                `基準価額 ${window.TrustfolioUi.formatCurrency(nav.value)}（${nav.date}）を取得しました。URL: ${response.value.url}`,
                'success'
              );
            }
          } catch (error) {
            if (discardOutdatedResponse()) return;
            setNavSourceCodeCheckMessage(error.message, 'error');
          } finally {
            isNavSourceCodeCheckInFlight = false;
            fundNavSourceCodeCheckButton.disabled = false;
          }
        });
        applyNavSourceKindToForm();
        await loadFunds();
        // 日次リフレッシュが必要な場合のみ更新時刻を記録
        if (needsRefresh) {
          recordUpdateTime();
        }
        setMessage('準備ができました。', 'success');
      } catch (error) {
        setMessage(error.message, 'error');
      } finally {
        setLoading(false);
      }
    })();
  })(); // Close IIFE
</script>
