<script>
  'use strict';

  const state = {
    funds: [],
    selectedTransactionFundId: null,
    editingTransactionId: null,
    editingRecurringId: null
  };

  const app = document.querySelector('.app');
  const fundForm = document.getElementById('fundForm');
  const fundNameInput = document.getElementById('fundName');
  const fundRakutenFundIdInput = document.getElementById('fundRakutenFundId');
  const fundSettlementBusinessDaysInput = document.getElementById('fundSettlementBusinessDays');
  const fundList = document.getElementById('fundList');
  const transactionForm = document.getElementById('transactionForm');
  const transactionFundSelect = document.getElementById('transactionFundSelect');
  const transactionDateInput = document.getElementById('transactionDate');
  const transactionDateLabel = document.getElementById('transactionDateLabel');
  const transactionAmountInput = document.getElementById('transactionAmount');
  const transactionUnitsInput = document.getElementById('transactionUnits');
  const transactionFeeInput = document.getElementById('transactionFee');
  const transactionNavValueInput = document.getElementById('transactionNavValue');
  const transactionList = document.getElementById('transactionList');
  const transactionSubmitButton = document.getElementById('transactionSubmitButton');
  const transactionCancelEditButton = document.getElementById('transactionCancelEdit');
  const purchaseFields = document.getElementById('purchaseFields');
  const saleFields = document.getElementById('saleFields');
  const saleAmountDisplay = document.getElementById('saleAmountDisplay');
  const calculatedSaleAmount = document.getElementById('calculatedSaleAmount');
  const recurringForm = document.getElementById('recurringForm');
  const recurringFundSelect = document.getElementById('recurringFundSelect');
  const recurringMonthlyAmountInput = document.getElementById('recurringMonthlyAmount');
  const recurringExecutionDayInput = document.getElementById('recurringExecutionDay');
  const recurringStartDateInput = document.getElementById('recurringStartDate');
  const recurringEndDateInput = document.getElementById('recurringEndDate');
  const recurringIsActiveInput = document.getElementById('recurringIsActive');
  const recurringList = document.getElementById('recurringList');
  const recurringSubmitButton = document.getElementById('recurringSubmitButton');
  const recurringCancelEditButton = document.getElementById('recurringCancelEdit');
  const holdingList = document.getElementById('holdingList');
  const portfolioInvestment = document.getElementById('portfolioInvestment');
  const portfolioValue = document.getElementById('portfolioValue');
  const portfolioGain = document.getElementById('portfolioGain');
  const portfolioGainRate = document.getElementById('portfolioGainRate');
  const message = document.getElementById('message');
  const refreshButton = document.getElementById('refreshButton');

  function setLoading(isLoading) {
    if (isLoading) {
      app.classList.add('loading');
    } else {
      app.classList.remove('loading');
    }
    document.querySelectorAll('button, input, select').forEach((element) => {
      element.disabled = isLoading;
    });
    refreshButton.disabled = false;
  }

  function callApi(request) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((error) => {
          reject(error);
        })
        .handleApiRequest(request);
    });
  }

  let successMessageTimer = null;

  function setMessage(text, stateValue) {
    message.textContent = text;
    if (stateValue) {
      message.setAttribute('data-state', stateValue);
    } else {
      message.removeAttribute('data-state');
    }

    if (successMessageTimer) {
      clearTimeout(successMessageTimer);
      successMessageTimer = null;
    }
    if (stateValue === 'success') {
      successMessageTimer = setTimeout(() => {
        if (message.getAttribute('data-state') === 'success') {
          message.textContent = '';
          message.removeAttribute('data-state');
        }
      }, 10000);
    }
  }

  function formatCurrency(value) {
    return `${value.toLocaleString()}円`;
  }

  function formatRate(value) {
    return `${(value * 100).toFixed(2)}%`;
  }

  function createActionButton(label, className, onClick) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.className = className;
    button.addEventListener('click', onClick);
    return button;
  }

  function resetTransactionForm() {
    transactionDateInput.value = '';
    transactionAmountInput.value = '';
    transactionFeeInput.value = '0';
    transactionNavValueInput.value = '';
  }

  function setTransactionEditMode(transaction) {
    if (!transaction) {
      state.editingTransactionId = null;
      transactionSubmitButton.textContent = '購入登録';
      transactionCancelEditButton.classList.add('hidden');
      resetTransactionForm();
      return;
    }

    state.editingTransactionId = transaction.id;
    transactionSubmitButton.textContent = '購入内容を更新';
    transactionCancelEditButton.classList.remove('hidden');
    transactionFundSelect.value = transaction.fundId;
    state.selectedTransactionFundId = transaction.fundId;
    transactionDateInput.value = transaction.date;
    transactionAmountInput.value = String(transaction.amount);
    transactionFeeInput.value = String(transaction.fee);
    transactionNavValueInput.value = String(transaction.navValue);
  }

  function resetRecurringForm() {
    recurringMonthlyAmountInput.value = '';
    recurringExecutionDayInput.value = '';
    recurringStartDateInput.value = '';
    recurringEndDateInput.value = '';
    recurringIsActiveInput.checked = true;
  }

  function setRecurringEditMode(recurring) {
    if (!recurring) {
      state.editingRecurringId = null;
      recurringSubmitButton.textContent = '設定を追加';
      recurringCancelEditButton.classList.add('hidden');
      resetRecurringForm();
      return;
    }

    state.editingRecurringId = recurring.id;
    recurringSubmitButton.textContent = '設定内容を更新';
    recurringCancelEditButton.classList.remove('hidden');
    recurringFundSelect.value = recurring.fundId;
    recurringMonthlyAmountInput.value = String(recurring.monthlyAmount);
    recurringExecutionDayInput.value = String(recurring.executionDay);
    recurringStartDateInput.value = recurring.startDate;
    recurringEndDateInput.value = recurring.endDate ?? '';
    recurringIsActiveInput.checked = recurring.isActive;
  }

  function renderFunds() {
    fundList.innerHTML = '';
    if (state.funds.length === 0) {
      const empty = document.createElement('li');
      empty.textContent = '銘柄が登録されていません。';
      fundList.appendChild(empty);
      return;
    }

    state.funds.forEach((fund) => {
      const item = document.createElement('li');
      const name = document.createElement('strong');
      name.textContent = fund.name;
      const meta = document.createElement('span');
      const codeText = fund.rakutenFundId ? ` (${fund.rakutenFundId})` : '';
      meta.textContent = `${fund.createdAt.split('T')[0]}${codeText}`;
      item.appendChild(name);
      item.appendChild(meta);
      fundList.appendChild(item);
    });
  }

  function renderTransactionSelect() {
    transactionFundSelect.innerHTML = '';
    if (state.funds.length === 0) {
      transactionFundSelect.disabled = true;
      const option = document.createElement('option');
      option.textContent = '銘柄がありません';
      option.value = '';
      transactionFundSelect.appendChild(option);
      return;
    }

    transactionFundSelect.disabled = false;
    state.funds.forEach((fund) => {
      const option = document.createElement('option');
      option.value = fund.id;
      option.textContent = fund.name;
      transactionFundSelect.appendChild(option);
    });

    if (
      !state.selectedTransactionFundId ||
      !state.funds.find((fund) => fund.id === state.selectedTransactionFundId)
    ) {
      state.selectedTransactionFundId = state.funds[0].id;
    }
    transactionFundSelect.value = state.selectedTransactionFundId;
  }

  function renderRecurringSelect() {
    recurringFundSelect.innerHTML = '';
    if (state.funds.length === 0) {
      recurringFundSelect.disabled = true;
      const option = document.createElement('option');
      option.textContent = '銘柄がありません';
      option.value = '';
      recurringFundSelect.appendChild(option);
      return;
    }

    recurringFundSelect.disabled = false;
    state.funds.forEach((fund) => {
      const option = document.createElement('option');
      option.value = fund.id;
      option.textContent = fund.name;
      recurringFundSelect.appendChild(option);
    });
  }

  function renderTransactions(transactions) {
    transactionList.innerHTML = '';
    if (transactions.length === 0) {
      const empty = document.createElement('li');
      empty.textContent = '取引履歴がありません。';
      transactionList.appendChild(empty);
      return;
    }

    transactions.forEach((transaction) => {
      const item = document.createElement('li');
      const content = document.createElement('div');
      content.className = 'list-content';
      const date = document.createElement('strong');
      date.textContent = transaction.date;
      const detail = document.createElement('span');
      let typeLabel = '';
      if (transaction.type === 'SPOT_PURCHASE') {
        typeLabel = '購入（スポット）';
      } else if (transaction.type === 'REDEMPTION') {
        typeLabel = '売却';
      } else {
        typeLabel = '購入（積立）';
      }
      const unitsDisplay = transaction.type === 'REDEMPTION'
        ? `${Math.abs(transaction.units).toLocaleString()}口`
        : `${transaction.units.toLocaleString()}口`;
      detail.textContent = `${transaction.amount.toLocaleString()}円 / ${unitsDisplay} / ${typeLabel}`;
      content.appendChild(date);
      content.appendChild(detail);
      item.appendChild(content);

      if (transaction.type === 'SPOT_PURCHASE') {
        const actions = document.createElement('div');
        actions.className = 'list-actions';
        const editButton = createActionButton('編集', 'ghost', () => {
          setTransactionEditMode(transaction);
        });
        const deleteButton = createActionButton('削除', 'ghost', async () => {
          if (!confirm('スポット購入履歴を削除します。よろしいですか？')) {
            return;
          }
          setMessage('スポット購入履歴を削除中...', null);
          setLoading(true);
          try {
            const response = await callApi({ action: 'deleteSpotPurchase', id: transaction.id });
            if (!response.success) {
              setMessage(response.error.message, 'error');
              return;
            }
            setMessage('スポット購入履歴を削除しました。', 'success');
            if (state.editingTransactionId === transaction.id) {
              setTransactionEditMode(null);
            }
            await loadTransactions(state.selectedTransactionFundId);
            await loadHoldings();
            await loadPortfolioSummary();
          } catch (error) {
            setMessage(error.message, 'error');
          } finally {
            setLoading(false);
          }
        });
        actions.appendChild(editButton);
        actions.appendChild(deleteButton);
        item.appendChild(actions);
      }

      transactionList.appendChild(item);
    });
  }

  function renderRecurringList(recurrings) {
    recurringList.innerHTML = '';
    if (recurrings.length === 0) {
      const empty = document.createElement('li');
      empty.textContent = '積立設定がありません。';
      recurringList.appendChild(empty);
      return;
    }

    recurrings.forEach((recurring) => {
      const item = document.createElement('li');
      const content = document.createElement('div');
      content.className = 'list-content';
      const title = document.createElement('strong');
      title.textContent = `${recurring.monthlyAmount.toLocaleString()}円 / 毎月${recurring.executionDay}日注文`;
      const detail = document.createElement('span');
      const period = recurring.endDate ? `${recurring.startDate}〜${recurring.endDate}` : recurring.startDate;
      const status = recurring.isActive ? 'アクティブ' : '停止中';
      detail.textContent = `${period} / ${status}`;
      content.appendChild(title);
      content.appendChild(detail);
      item.appendChild(content);

      const actions = document.createElement('div');
      actions.className = 'list-actions';
      const editButton = createActionButton('編集', 'ghost', () => {
        setRecurringEditMode(recurring);
      });
      const deleteButton = createActionButton('削除', 'ghost', async () => {
        if (!confirm('積立設定を削除します。よろしいですか？')) {
          return;
        }
        setMessage('積立設定を削除中...', null);
        setLoading(true);
        try {
          const response = await callApi({ action: 'deleteRecurringPurchase', id: recurring.id });
          if (!response.success) {
            setMessage(response.error.message, 'error');
            return;
          }
          setMessage('積立設定を削除しました。', 'success');
          if (state.editingRecurringId === recurring.id) {
            setRecurringEditMode(null);
          }
          await loadRecurringPurchases();
        } catch (error) {
          setMessage(error.message, 'error');
        } finally {
          setLoading(false);
        }
      });
      actions.appendChild(editButton);
      actions.appendChild(deleteButton);
      item.appendChild(actions);
      recurringList.appendChild(item);
    });
  }


  function renderHoldings(holdings) {
    holdingList.innerHTML = '';
    if (holdings.length === 0) {
      const empty = document.createElement('li');
      empty.textContent = '保有情報がありません。';
      holdingList.appendChild(empty);
      return;
    }

    holdings.forEach((holding) => {
      const item = document.createElement('li');
      const title = document.createElement('strong');
      title.textContent = holding.fundName;
      const detail = document.createElement('span');
      const valueText =
        holding.currentValue === null ? 'NAV未登録' : formatCurrency(holding.currentValue);
      detail.textContent = `${holding.totalUnits.toLocaleString()}口 / ${valueText}`;
      item.appendChild(title);
      item.appendChild(detail);
      holdingList.appendChild(item);
    });
  }

  function renderPortfolioSummary(portfolio) {
    portfolioInvestment.textContent = formatCurrency(portfolio.totalInvestment);
    if (portfolio.totalCurrentValue === null) {
      portfolioValue.textContent = 'NAV未登録';
      portfolioValue.className = 'summary-value muted';
      portfolioGain.textContent = '-';
      portfolioGain.className = 'summary-value muted';
      portfolioGainRate.textContent = '-';
      portfolioGainRate.className = 'summary-value muted';
      return;
    }

    portfolioValue.textContent = formatCurrency(portfolio.totalCurrentValue);
    portfolioValue.className = 'summary-value';
    portfolioGain.textContent = formatCurrency(portfolio.totalUnrealizedGain);
    portfolioGain.className = `summary-value ${
      portfolio.totalUnrealizedGain >= 0 ? 'positive' : 'negative'
    }`;
    portfolioGainRate.textContent = formatRate(portfolio.totalUnrealizedGainRate);
    portfolioGainRate.className = `summary-value ${
      portfolio.totalUnrealizedGainRate >= 0 ? 'positive' : 'negative'
    }`;
  }

  async function loadFunds() {
    const response = await callApi({ action: 'listFunds' });
    if (!response.success) {
      throw new Error(response.error.message);
    }
    state.funds = response.value;
    renderFunds();
    renderTransactionSelect();
    renderRecurringSelect();
    if (state.selectedTransactionFundId) {
      await loadTransactions(state.selectedTransactionFundId);
    }
    await loadRecurringPurchases();
    await loadHoldings();
    await loadPortfolioSummary();
  }

  async function loadTransactions(fundId) {
    const response = await callApi({ action: 'getTransactionHistory', fundId });
    if (!response.success) {
      throw new Error(response.error.message);
    }
    renderTransactions(response.value);
  }

  async function loadRecurringPurchases() {
    const response = await callApi({ action: 'listRecurringPurchases' });
    if (!response.success) {
      throw new Error(response.error.message);
    }
    renderRecurringList(response.value);
  }

  async function loadHoldings() {
    const response = await callApi({ action: 'listHoldings' });
    if (!response.success) {
      throw new Error(response.error.message);
    }
    renderHoldings(response.value);
  }

  async function loadPortfolioSummary() {
    const response = await callApi({ action: 'getPortfolioSummary' });
    if (!response.success) {
      throw new Error(response.error.message);
    }
    renderPortfolioSummary(response.value);
  }

  fundForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const name = fundNameInput.value;
    const rakutenFundId = fundRakutenFundIdInput.value.trim() || null;
    const settlementBusinessDaysText = fundSettlementBusinessDaysInput.value.trim();
    const settlementBusinessDays =
      settlementBusinessDaysText === '' ? null : Number(settlementBusinessDaysText);
    setMessage('登録中...', null);
    setLoading(true);
    try {
      const response = await callApi({
        action: 'createFund',
        name,
        rakutenFundId,
        settlementBusinessDays
      });
      if (!response.success) {
        setMessage(response.error.message, 'error');
        return;
      }
      fundNameInput.value = '';
      fundRakutenFundIdInput.value = '';
      fundSettlementBusinessDaysInput.value = '';
      setMessage('銘柄を登録しました。', 'success');
      await loadFunds();
    } catch (error) {
      setMessage(error.message, 'error');
    } finally {
      setLoading(false);
    }
  });

  // 取引種別ラジオボタンの切り替え処理
  const transactionTypeRadios = document.querySelectorAll('input[name="transactionType"]');
  transactionTypeRadios.forEach((radio) => {
    radio.addEventListener('change', (event) => {
      const transactionType = event.target.value;
      if (transactionType === 'purchase') {
        // 購入モード
        purchaseFields.classList.remove('hidden');
        saleFields.classList.add('hidden');
        saleAmountDisplay.classList.add('hidden');
        transactionDateLabel.textContent = '購入日';
        transactionSubmitButton.textContent = '購入登録';
        transactionAmountInput.required = true;
        transactionUnitsInput.required = false;
      } else {
        // 売却モード
        purchaseFields.classList.add('hidden');
        saleFields.classList.remove('hidden');
        saleAmountDisplay.classList.remove('hidden');
        transactionDateLabel.textContent = '売却日';
        transactionSubmitButton.textContent = '売却登録';
        transactionAmountInput.required = false;
        transactionUnitsInput.required = true;
        updateCalculatedSaleAmount();
      }
    });
  });

  // 売却金額の自動計算（口数または基準価額が変更された時）
  function updateCalculatedSaleAmount() {
    const units = Number(transactionUnitsInput.value || 0);
    const navValue = Number(transactionNavValueInput.value || 0);
    if (units > 0 && navValue > 0) {
      const amount = Math.round((units / 10000) * navValue);
      calculatedSaleAmount.textContent = `${amount.toLocaleString()}円`;
    } else {
      calculatedSaleAmount.textContent = '-';
    }
  }

  transactionUnitsInput.addEventListener('input', updateCalculatedSaleAmount);
  transactionNavValueInput.addEventListener('input', () => {
    const selectedType = document.querySelector('input[name="transactionType"]:checked').value;
    if (selectedType === 'sale') {
      updateCalculatedSaleAmount();
    }
  });

  transactionForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const transactionType = document.querySelector('input[name="transactionType"]:checked').value;
    const fundId = transactionFundSelect.value;
    const date = transactionDateInput.value;
    const fee = Number(transactionFeeInput.value || 0);
    const navValue = Number(transactionNavValueInput.value);
    const isEditing = Boolean(state.editingTransactionId);

    if (transactionType === 'purchase') {
      // 購入処理
      const amount = Number(transactionAmountInput.value);
      setMessage(isEditing ? 'スポット購入を更新中...' : '購入登録中...', null);
      setLoading(true);
      try {
        const response = await callApi(
          isEditing
            ? {
                action: 'updateSpotPurchase',
                id: state.editingTransactionId,
                fundId,
                date,
                amount,
                fee,
                navValue
              }
            : {
                action: 'executeSpotPurchase',
                fundId,
                date,
                amount,
                fee,
                navValue
              }
        );
        if (!response.success) {
          setMessage(response.error.message, 'error');
          return;
        }
        setMessage(
          isEditing ? 'スポット購入の内容を更新しました。' : 'スポット購入を登録しました。',
          'success'
        );
        setTransactionEditMode(null);
        await loadTransactions(fundId);
        await loadHoldings();
        await loadPortfolioSummary();
      } catch (error) {
        setMessage(error.message, 'error');
      } finally {
        setLoading(false);
      }
    } else {
      // 売却処理
      const units = Number(transactionUnitsInput.value);
      setMessage('売却登録中...', null);
      setLoading(true);
      try {
        const response = await callApi({
          action: 'executeSale',
          fundId,
          date,
          units,
          navValue,
          fee
        });
        if (!response.success) {
          setMessage(response.error.message, 'error');
          return;
        }
        setMessage('売却を登録しました。', 'success');
        transactionForm.reset();
        // 購入モードに戻す
        document.querySelector('input[name="transactionType"][value="purchase"]').checked = true;
        transactionTypeRadios[0].dispatchEvent(new Event('change'));
        await loadTransactions(fundId);
        await loadHoldings();
        await loadPortfolioSummary();
      } catch (error) {
        setMessage(error.message, 'error');
      } finally {
        setLoading(false);
      }
    }
  });

  transactionCancelEditButton.addEventListener('click', () => {
    setTransactionEditMode(null);
  });

  recurringForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const fundId = recurringFundSelect.value;
    const monthlyAmount = Number(recurringMonthlyAmountInput.value);
    const executionDay = Number(recurringExecutionDayInput.value);
    const startDate = recurringStartDateInput.value;
    const endDate = recurringEndDateInput.value || null;
    const isActive = recurringIsActiveInput.checked;
    const isEditing = Boolean(state.editingRecurringId);
    setMessage(isEditing ? '積立設定を更新中...' : '積立設定を登録中...', null);
    setLoading(true);
    try {
      const response = await callApi(
        isEditing
          ? {
              action: 'updateRecurringPurchase',
              id: state.editingRecurringId,
              fundId,
              monthlyAmount,
              executionDay,
              startDate,
              endDate,
              isActive
            }
          : {
              action: 'createRecurringPurchase',
              fundId,
              monthlyAmount,
              executionDay,
              startDate,
              endDate,
              isActive
            }
      );
      if (!response.success) {
        setMessage(response.error.message, 'error');
        return;
      }
      setMessage(isEditing ? '積立設定を更新しました。' : '積立設定を追加しました。', 'success');
      setRecurringEditMode(null);
      await loadRecurringPurchases();
    } catch (error) {
      setMessage(error.message, 'error');
    } finally {
      setLoading(false);
    }
  });

  recurringCancelEditButton.addEventListener('click', () => {
    setRecurringEditMode(null);
  });

  transactionFundSelect.addEventListener('change', async (event) => {
    const fundId = event.target.value;
    state.selectedTransactionFundId = fundId;
    if (!fundId) {
      renderTransactions([]);
      return;
    }
    try {
      await loadTransactions(fundId);
    } catch (error) {
      setMessage(error.message, 'error');
    }
  });


  refreshButton.addEventListener('click', async () => {
    setMessage('再読み込み中...', null);
    setLoading(true);
    try {
      await loadFunds();
      setMessage('最新の情報を取得しました。', 'success');
    } catch (error) {
      setMessage(error.message, 'error');
    } finally {
      setLoading(false);
    }
  });


  (async () => {
    setMessage('読み込み中...', null);
    setLoading(true);
    try {
      await loadFunds();
      setMessage('準備ができました。', 'success');
    } catch (error) {
      setMessage(error.message, 'error');
    } finally {
      setLoading(false);
    }
  })();
</script>
