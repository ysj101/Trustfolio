<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <?!= include('styles'); ?>
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <div class="title-block">
          <h1>Trustfolio</h1>
          <p class="subtitle">投資信託と基準価額をシンプルに記録するための管理画面。</p>
        </div>
        <button id="refreshButton" class="ghost">再読み込み</button>
      </header>

      <aside id="message" class="message" role="status" aria-live="polite"></aside>

      <main class="grid">
        <section class="panel">
          <h2>ポートフォリオ</h2>
          <div class="panel-body">
            <div class="summary-card">
              <div>
                <p class="summary-label">投資総額</p>
                <p id="portfolioInvestment" class="summary-value">-</p>
              </div>
              <div>
                <p class="summary-label">評価額</p>
                <p id="portfolioValue" class="summary-value">-</p>
              </div>
              <div>
                <p class="summary-label">含み損益</p>
                <p id="portfolioGain" class="summary-value">-</p>
              </div>
              <div>
                <p class="summary-label">損益率</p>
                <p id="portfolioGainRate" class="summary-value">-</p>
              </div>
            </div>
          </div>
        </section>

        <section class="panel">
          <h2>保有情報</h2>
          <div class="panel-body">
            <div class="list-block">
              <h3>保有一覧</h3>
              <ul id="holdingList" class="list"></ul>
            </div>
          </div>
        </section>

        <section class="panel">
          <h2>投資信託</h2>
          <div class="panel-body">
            <form id="fundForm" class="form">
              <label for="fundName">銘柄名</label>
              <input
                type="text"
                id="fundName"
                name="fundName"
                placeholder="例: つみたて全世界株式"
                required
              />
              <label for="fundRakutenFundId">楽天ファンドID (12桁)</label>
              <input
                type="text"
                id="fundRakutenFundId"
                name="fundRakutenFundId"
                placeholder="例: JP90C000H1T1"
                pattern="[A-Za-z0-9]{12}"
                title="12桁の英数字を入力してください"
              />
              <label for="fundSettlementBusinessDays">約定までの営業日数</label>
              <input
                type="number"
                id="fundSettlementBusinessDays"
                name="fundSettlementBusinessDays"
                min="0"
                step="1"
              />
              <button type="submit" class="primary">登録</button>
            </form>
            <div class="list-block">
              <h3>銘柄一覧</h3>
              <ul id="fundList" class="list"></ul>
            </div>
          </div>
        </section>

        <section class="panel">
          <h2>スポット取引</h2>
          <div class="panel-body">
            <form id="transactionForm" class="form">
              <fieldset class="radio-group">
                <legend>取引種別</legend>
                <label class="radio-label">
                  <input type="radio" name="transactionType" value="purchase" checked />
                  購入
                </label>
                <label class="radio-label">
                  <input type="radio" name="transactionType" value="sale" />
                  売却
                </label>
              </fieldset>

              <label for="transactionFundSelect">対象銘柄</label>
              <select id="transactionFundSelect" name="transactionFundSelect"></select>
              <label for="transactionDate" id="transactionDateLabel">購入日</label>
              <input type="date" id="transactionDate" name="transactionDate" required />

              <!-- 購入用フィールド -->
              <div id="purchaseFields">
                <label for="transactionAmount">購入金額 (円)</label>
                <input
                  type="number"
                  id="transactionAmount"
                  name="transactionAmount"
                  min="1"
                  step="1"
                />
              </div>

              <!-- 売却用フィールド -->
              <div id="saleFields" class="hidden">
                <label for="transactionUnits">売却口数</label>
                <input
                  type="number"
                  id="transactionUnits"
                  name="transactionUnits"
                  min="1"
                  step="1"
                />
              </div>

              <label for="transactionNavValue">適用基準価額 (円/1万口)</label>
              <input
                type="number"
                id="transactionNavValue"
                name="transactionNavValue"
                min="1"
                step="1"
                required
              />
              <label for="transactionFee">手数料 (円)</label>
              <input type="number" id="transactionFee" name="transactionFee" min="0" step="1" value="0" />

              <!-- 売却金額表示（売却時のみ） -->
              <div id="saleAmountDisplay" class="hidden">
                <label>売却金額（自動計算）</label>
                <p id="calculatedSaleAmount" class="calculated-value">-</p>
              </div>

              <div class="form-inline">
                <button type="submit" class="primary" id="transactionSubmitButton">購入登録</button>
                <button type="button" class="ghost hidden" id="transactionCancelEdit">
                  編集をキャンセル
                </button>
              </div>
            </form>
            <div class="list-block">
              <h3>取引履歴</h3>
              <ul id="transactionList" class="list"></ul>
            </div>
          </div>
        </section>

        <section class="panel">
          <h2>積立設定</h2>
          <div class="panel-body">
            <form id="recurringForm" class="form">
              <label for="recurringFundSelect">対象銘柄</label>
              <select id="recurringFundSelect" name="recurringFundSelect"></select>
              <label for="recurringMonthlyAmount">月額購入金額 (円)</label>
              <input
                type="number"
                id="recurringMonthlyAmount"
                name="recurringMonthlyAmount"
                min="1"
                step="1"
                required
              />
              <label for="recurringExecutionDay">注文日 (1〜28)</label>
              <input
                type="number"
                id="recurringExecutionDay"
                name="recurringExecutionDay"
                min="1"
                max="28"
                step="1"
                required
              />
              <label for="recurringStartDate">開始日</label>
              <input type="date" id="recurringStartDate" name="recurringStartDate" required />
              <label for="recurringEndDate">終了日 (任意)</label>
              <input type="date" id="recurringEndDate" name="recurringEndDate" />
              <label class="checkbox">
                <input type="checkbox" id="recurringIsActive" name="recurringIsActive" checked />
                アクティブ
              </label>
              <div class="form-inline">
                <button type="submit" class="primary" id="recurringSubmitButton">設定を追加</button>
                <button type="button" class="ghost hidden" id="recurringCancelEdit">
                  編集をキャンセル
                </button>
              </div>
            </form>
            <div class="list-block">
              <h3>積立一覧</h3>
              <ul id="recurringList" class="list"></ul>
            </div>
          </div>
        </section>
      </main>
    </div>

    <?!= include('scripts'); ?>
  </body>
</html>
