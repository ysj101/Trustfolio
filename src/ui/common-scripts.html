<script>
  'use strict';

  /**
   * 画面間で共有するUIユーティリティ群。
   *
   * 目的:
   * - Index.html（scripts / performance-scripts）と Performance.html
   *   （performance-scripts）で重複していた callApi / setLoading / setMessage /
   *   通貨・パーセントのフォーマッタを一元化する。
   *
   * 使い方:
   * - 各画面は <?!= include('common-scripts'); ?> を画面スクリプトより前に読み込み、
   *   IIFE 内から window.TrustfolioUi 経由で各関数を参照する。
   *
   * 注意:
   * - 画面スクリプトはそれぞれ独立した IIFE のため、共有関数はグローバル
   *   （window.TrustfolioUi）へ公開して両 IIFE から参照できるようにしている。
   */
  window.TrustfolioUi = (function () {
    const assetClassBadgeBaseClass =
      'inline-flex items-center rounded-md px-2 py-0.5 text-[10px] font-semibold uppercase tracking-[0.2em]';
    /** UI側の資産クラス定義。サーバー側のASSET_CLASS_LABELSと一致することをテストで保証する。 */
    const ASSET_CLASS_OPTIONS = [
      {
        value: 'equity',
        label: '株式',
        badgeClass: `${assetClassBadgeBaseClass} border border-indigo-500/40 bg-indigo-500/15 text-indigo-300`,
      },
      {
        value: 'gold',
        label: '金',
        badgeClass: `${assetClassBadgeBaseClass} border border-yellow-500/40 bg-yellow-500/15 text-yellow-300`,
      },
    ];
    /** 資産クラス未設定時の表示情報。 */
    const UNSET_ASSET_CLASS_OPTION = {
      label: '未設定',
      badgeClass: `${assetClassBadgeBaseClass} border border-amber-500/40 bg-amber-500/15 text-amber-300`,
    };

    /**
     * 基準価額の取得元種別。投資信託登録フォームのセレクト（Index.html の fundNavSourceKind）の
     * value と一致させる。
     * - none: 取得しない（rakutenFundId / navSource / navSourceCode すべて null）
     * - rakuten: 楽天証券（rakutenFundId のみ設定）
     * - wealthadvisor: Wealth Advisor（navSource='wealthadvisor' と navSourceCode を設定）
     */
    const NAV_SOURCE_KINDS = Object.freeze({
      NONE: 'none',
      RAKUTEN: 'rakuten',
      WEALTH_ADVISOR: 'wealthadvisor',
    });

    /**
     * Fund.navSource の永続値（src/domain/types.ts の Fund 型 navSource: 'wealthadvisor' | null と一致させる）。
     * UI セレクトの種別 NAV_SOURCE_KINDS.WEALTH_ADVISOR とは別ドメインの値のため、流用せず別定数にする。
     */
    const WEALTH_ADVISOR_NAV_SOURCE = 'wealthadvisor';

    /**
     * 取得元種別ごとのセレクト表示ラベル。一覧表示（formatNavSourceLabel）でも同じ文言を使う。
     * キーの定義順（取得しない・楽天証券・Wealth Advisor）がそのままセレクトの表示順になる。
     * Index.html には option を直書きせず、populateNavSourceKindSelect がここから生成する。
     */
    const NAV_SOURCE_LABELS = Object.freeze({
      [NAV_SOURCE_KINDS.NONE]: '取得しない',
      [NAV_SOURCE_KINDS.RAKUTEN]: '楽天証券',
      [NAV_SOURCE_KINDS.WEALTH_ADVISOR]: 'Wealth Advisor',
    });

    /**
     * 基準価額の取得元セレクトをラベル定義から組み立て直す。
     * 既存の選択肢を消去し、取得しない・楽天証券・Wealth Advisor の順で追加する
     * （プレースホルダは置かず、先頭の「取得しない」が既定値になる）。
     *
     * @param {HTMLSelectElement} select - 選択肢を追加する select 要素
     * @returns {void}
     */
    function populateNavSourceKindSelect(select) {
      select.innerHTML = '';
      appendOptions(
        select,
        Object.entries(NAV_SOURCE_LABELS).map(([value, label]) => ({ value, label }))
      );
    }

    /**
     * 取得元種別と trim 済みの入力コードから、createFund へ送信する取得元3フィールドを組み立てる。
     * 楽天ファンドIDと Wealth Advisor 取得元コードはサーバー側で排他のため、選択された種別の
     * フィールドだけを埋め、他方は必ず null にする。
     *
     * @param {'none'|'rakuten'|'wealthadvisor'} kind - 取得元種別
     * @param {string} code - trim 済みの入力コード（none では使用しない）
     * @returns {{ success: true, value: { rakutenFundId: string|null, navSource: 'wealthadvisor'|null, navSourceCode: string|null } } | { success: false, error: { type: 'validation'|'unexpected', message: string } }}
     */
    function buildNavSourceFields(kind, code) {
      if (kind === NAV_SOURCE_KINDS.NONE)
        return {
          success: true,
          value: { rakutenFundId: null, navSource: null, navSourceCode: null },
        };
      if (kind === NAV_SOURCE_KINDS.RAKUTEN) {
        if (code === '')
          return {
            success: false,
            error: { type: 'validation', message: '楽天ファンドIDを入力してください。' },
          };
        return {
          success: true,
          value: { rakutenFundId: code, navSource: null, navSourceCode: null },
        };
      }
      if (kind === NAV_SOURCE_KINDS.WEALTH_ADVISOR) {
        if (code === '')
          return {
            success: false,
            error: { type: 'validation', message: '取得元コードを入力してください。' },
          };
        return {
          success: true,
          value: { rakutenFundId: null, navSource: WEALTH_ADVISOR_NAV_SOURCE, navSourceCode: code },
        };
      }
      return {
        success: false,
        error: { type: 'unexpected', message: `未知の基準価額取得元種別です: ${String(kind)}` },
      };
    }

    /**
     * Fund の取得元フィールドから取得元種別を逆引きする。
     * navSource が 'wealthadvisor' なら Wealth Advisor、そうでなく rakutenFundId があれば楽天証券、
     * いずれでもなければ「取得しない」。
     *
     * 注意: 楽天ファンドIDと Wealth Advisor の二重指定、取得元未設定なのに取得元コードあり、
     * Wealth Advisor なのに取得元コードなし、といった組み合わせ不変条件は
     * src/repository/FundRepository.ts の validateNavSourceCombination がシート読み取り時に fail fast で
     * 拒否するため、ブラウザに届く Fund は必ず満たしている。UI では型契約の検証
     * （navSource が未知の値でないこと）だけを行い、未知の値は暗黙に「取得しない」へ読み替えず失敗 Result にする。
     *
     * @param {{ rakutenFundId: string|null, navSource: 'wealthadvisor'|null, navSourceCode: string|null }} fund
     * @returns {{ success: true, value: 'none'|'rakuten'|'wealthadvisor' } | { success: false, error: { type: 'unexpected', message: string } }}
     */
    function resolveNavSourceKind(fund) {
      if (fund.navSource !== null && fund.navSource !== WEALTH_ADVISOR_NAV_SOURCE)
        return {
          success: false,
          error: {
            type: 'unexpected',
            message: `未知の基準価額取得元です: ${String(fund.navSource)}`,
          },
        };
      if (fund.navSource === WEALTH_ADVISOR_NAV_SOURCE)
        return { success: true, value: NAV_SOURCE_KINDS.WEALTH_ADVISOR };
      if (fund.rakutenFundId !== null) return { success: true, value: NAV_SOURCE_KINDS.RAKUTEN };
      return { success: true, value: NAV_SOURCE_KINDS.NONE };
    }

    /**
     * 銘柄一覧に表示する基準価額取得元のラベルを返す。
     * 種別ごとに「楽天証券: <ID>」「Wealth Advisor: <コード>」「取得元未設定」の統一形式にする
     * （楽天証券 / Wealth Advisor の文言はセレクトの NAV_SOURCE_LABELS と共有する。取得元なしは選択肢の
     *   「取得しない」ではなく、一覧では状態を表す「取得元未設定」と表示する）。
     * 判定に失敗した場合は resolveNavSourceKind の失敗 Result をそのまま返す。
     *
     * @param {{ rakutenFundId: string|null, navSource: 'wealthadvisor'|null, navSourceCode: string|null }} fund
     * @returns {{ success: true, value: string } | { success: false, error: { type: 'unexpected', message: string } }}
     */
    function formatNavSourceLabel(fund) {
      const result = resolveNavSourceKind(fund);
      if (!result.success) return result;
      if (result.value === NAV_SOURCE_KINDS.RAKUTEN)
        return {
          success: true,
          value: `${NAV_SOURCE_LABELS[result.value]}: ${fund.rakutenFundId}`,
        };
      if (result.value === NAV_SOURCE_KINDS.WEALTH_ADVISOR)
        return {
          success: true,
          value: `${NAV_SOURCE_LABELS[result.value]}: ${fund.navSourceCode}`,
        };
      return { success: true, value: '取得元未設定' };
    }

    /** 資産クラスの表示情報と順位を解決する。nullは未設定として最後に配置する。 */
    function resolveAssetClassOption(assetClass) {
      if (assetClass === null) {
        return {
          success: true,
          value: { option: UNSET_ASSET_CLASS_OPTION, order: ASSET_CLASS_OPTIONS.length },
        };
      }
      const index = ASSET_CLASS_OPTIONS.findIndex((candidate) => candidate.value === assetClass);
      if (index < 0) {
        return {
          success: false,
          error: { type: 'unexpected', message: `未対応の資産クラスです: ${String(assetClass)}` },
        };
      }
      return { success: true, value: { option: ASSET_CLASS_OPTIONS[index], order: index } };
    }

    /**
     * select 要素に選択肢を追加する（資産クラス・取得元種別・銘柄選択の option 生成で共通利用する）。
     * 既存の選択肢は消去しない。消去が必要な呼び出し側は事前に innerHTML = '' を行う。
     *
     * @param {HTMLSelectElement} select - 選択肢を追加する select 要素
     * @param {ReadonlyArray<{ value: string, label: string }>} options - value と表示ラベルの組
     * @returns {void}
     */
    function appendOptions(select, options) {
      options.forEach((option) => {
        const element = document.createElement('option');
        element.value = option.value;
        element.textContent = option.label;
        select.appendChild(element);
      });
    }

    /**
     * 資産クラス選択欄を共通定義から組み立て直す。
     * 既存の選択肢を消去し、未選択用プレースホルダー、株式、金の順で追加する。
     *
     * @param {HTMLSelectElement} select - 選択肢を追加するselect要素
     * @returns {void}
     */
    function populateAssetClassSelect(select) {
      select.innerHTML = '';
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = '選択してください';
      select.appendChild(placeholder);
      appendOptions(select, ASSET_CLASS_OPTIONS);
    }

    /**
     * 資産クラスを示すバッジを生成する。
     * nullは導入前の銘柄に残る未設定状態として警告色で表示する。
     * 定義外の値は未設定へ読み替えず、unexpectedエラーを持つ失敗結果として返す。
     *
     * @param {'equity'|'gold'|null} assetClass - 表示する資産クラス
     * @returns {{ success: true, value: HTMLSpanElement } | { success: false, error: { type: 'unexpected', message: string } }}
     *   成功時は資産クラスのラベルを持つバッジ、失敗時は未対応値を示すエラー
     */
    function createAssetClassBadge(assetClass) {
      const badge = document.createElement('span');
      const result = resolveAssetClassOption(assetClass);
      if (!result.success) return result;
      badge.textContent = result.value.option.label;
      badge.className = result.value.option.badgeClass;
      return { success: true, value: badge };
    }

    /**
     * GAS の handleApiRequestJson が返した JSON 文字列を Result オブジェクトへ復元する。
     *
     * 文字列以外の値・JSON として解釈できない文字列は、いずれも「サーバー側の契約
     * （Result を JSON.stringify した文字列を返す）への違反」なので、暗黙に解決せず
     * 文脈の分かる日本語メッセージのエラーを投げて fail fast する。JSON.parse が投げる
     * 英語の SyntaxError をそのまま画面へ出さないための包み直しである。
     *
     * @param {unknown} value - google.script.run の成功ハンドラが受け取った値
     * @returns {unknown} JSON.parse 済みのレスポンス（Result型オブジェクト）
     */
    function parseApiResponse(value) {
      if (typeof value !== 'string') {
        // typeof null は 'object' になり原因が隠れるため、null は明示的に 'null' と報告する。
        throw new Error(
          `APIレスポンスが文字列ではありません: ${value === null ? 'null' : typeof value}`
        );
      }
      try {
        return JSON.parse(value);
      } catch (error) {
        throw new Error(`APIレスポンスのJSON解析に失敗しました: ${error.message}`);
      }
    }

    /**
     * GAS の handleApiRequestJson を Promise でラップして呼び出す。
     * サーバーが JSON 文字列で返す理由（google.script.run が null プロパティを欠落させる）は
     * src/main.ts の handleApiRequestJson の TSDoc を参照。ここでは parseApiResponse で復元する。
     *
     * @param {unknown} request - APIリクエストオブジェクト
     * @returns {Promise<unknown>} JSON.parse 済みのレスポンス（Result型オブジェクト）
     */
    function callApi(request) {
      // 復元は then 側で行う（google.script.run は成功ハンドラ内の例外を飲み込み reject されないため）。
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .handleApiRequestJson(request);
      }).then(parseApiResponse);
    }

    /**
     * 金額を「N,NNN円」形式に整形する。
     * 値は円単位。小数を含む場合（チャート軸の補間値など）は四捨五入する。
     * サーバー由来の金額は既に整数へ丸め済みのため、四捨五入による表示変化はない。
     *
     * @param {number} value - 金額（円）
     * @returns {string} 例: "1,234,000円"
     */
    function formatCurrency(value) {
      return `${Math.round(value).toLocaleString()}円`;
    }

    /**
     * 比率（小数）をパーセント表記へ整形する。
     *
     * @param {number} value - 比率（例: 0.1234）
     * @returns {string} 例: "12.34%"
     */
    function formatPercent(value) {
      return `${(value * 100).toFixed(2)}%`;
    }

    /**
     * 資産クラス選択肢の定義順をソート順位へ変換する。
     * 未設定は選択肢数の順位で最後にし、未知の値はunexpected失敗として返す。
     * 戻り値はResult形式のため、呼び出し元はvalueを直接減算せずsuccessを確認する。
     */
    function getAssetClassOrder(assetClass) {
      const result = resolveAssetClassOption(assetClass);
      if (!result.success) return result;
      return { success: true, value: result.value.order };
    }

    /**
     * ローディング状態を切り替える。
     * 無効化対象の要素は画面ごとに異なるため controlSelector で指定する。
     *
     * @param {boolean} isLoading - ローディング中なら true
     * @param {string} controlSelector - 無効化対象要素のCSSセレクタ
     */
    function setLoading(isLoading, controlSelector) {
      const app = document.querySelector('.app');
      if (isLoading) {
        app.classList.add('opacity-60', 'pointer-events-none');
      } else {
        app.classList.remove('opacity-60', 'pointer-events-none');
      }
      document.querySelectorAll(controlSelector).forEach((element) => {
        element.disabled = isLoading;
      });
      const refreshButton = document.getElementById('refreshButton');
      if (refreshButton) {
        refreshButton.disabled = false;
      }
    }

    /**
     * 指定したメッセージ要素に紐づく setMessage 関数を生成する。
     * 成功メッセージ（stateValue === 'success'）は10秒後に自動で消去する。
     * 自動消去用のタイマーは生成した関数ごとに独立して保持する。
     *
     * @param {HTMLElement} messageElement - メッセージ表示用の要素
     * @returns {(text: string, stateValue: string|null) => void} setMessage 関数
     */
    function createSetMessage(messageElement) {
      let successMessageTimer = null;
      return function setMessage(text, stateValue) {
        messageElement.textContent = text;
        if (stateValue) {
          messageElement.setAttribute('data-state', stateValue);
        } else {
          messageElement.removeAttribute('data-state');
        }
        if (text) {
          messageElement.classList.remove('hidden');
        } else {
          messageElement.classList.add('hidden');
        }

        if (successMessageTimer) {
          clearTimeout(successMessageTimer);
          successMessageTimer = null;
        }
        if (stateValue === 'success') {
          successMessageTimer = setTimeout(() => {
            if (messageElement.getAttribute('data-state') === 'success') {
              messageElement.textContent = '';
              messageElement.removeAttribute('data-state');
              messageElement.classList.add('hidden');
            }
          }, 10000);
        }
      };
    }

    /**
     * 銘柄選択用の <select> 要素を再描画する共通ファクトリ。
     *
     * scripts.html の renderTransactionSelect / renderRecurringSelect が共有していた
     * 「option を一旦クリア → 銘柄が無ければ disabled + プレースホルダ → 銘柄があれば
     * 各 fund を option 化」という同一構造を集約する。
     *
     * 「選択値を維持する」挙動（取引フォーム側）と「維持しない」挙動（積立フォーム側）の
     * 差分のみ options.keepSelection で切り替える。DOM 生成内容は集約前と同一になる。
     *
     * @param {HTMLSelectElement} selectElement - 対象の <select> 要素
     * @param {ReadonlyArray<{ id: string; name: string }>} funds - 銘柄一覧
     * @param {{ keepSelection?: boolean; selectedFundId?: string | null }} [options]
     *   - keepSelection: true の場合のみ、解決済みの選択 fundId を <select>.value に設定して返す
     *   - selectedFundId: 維持したい選択 fundId（存在しなければ先頭 fund にフォールバック）
     * @returns {string | null} keepSelection 指定かつ銘柄が存在する場合は解決済みの fundId、
     *   それ以外（銘柄が空 / keepSelection 未指定）は null
     */
    function renderFundSelect(selectElement, funds, options) {
      const opts = options || {};
      selectElement.innerHTML = '';

      // 銘柄が1件も無い場合は選択不可にし、案内用の単一 option のみを表示する。
      if (funds.length === 0) {
        selectElement.disabled = true;
        const option = document.createElement('option');
        option.textContent = '銘柄がありません';
        option.value = '';
        selectElement.appendChild(option);
        return null;
      }

      selectElement.disabled = false;
      appendOptions(
        selectElement,
        funds.map((fund) => ({ value: fund.id, label: fund.name }))
      );

      // 取引フォームのみ、直前の選択 fundId を維持する。
      // 選択が未設定 or 既に存在しない銘柄を指していた場合は先頭の銘柄へフォールバックする。
      if (opts.keepSelection) {
        let selectedFundId = opts.selectedFundId;
        if (!selectedFundId || !funds.find((fund) => fund.id === selectedFundId)) {
          selectedFundId = funds[0].id;
        }
        selectElement.value = selectedFundId;
        return selectedFundId;
      }

      return null;
    }

    /**
     * リストの空状態を表す <li> を生成する。
     *
     * scripts.html の各 render 関数が「空配列なら案内文の <li> を1件だけ追加する」処理を
     * 繰り返していたため、その <li> 生成のみを共通化する。
     *
     * @param {string} message - 表示する案内文（例: "取引履歴がありません。"）
     * @param {string} className - <li> に付与するクラス文字列
     * @returns {HTMLLIElement} 案内文を持つ <li> 要素
     */
    function createEmptyListItem(message, className) {
      const empty = document.createElement('li');
      empty.className = className;
      empty.textContent = message;
      return empty;
    }

    /**
     * リスト行内の操作ボタン（編集 / 削除など）を生成する。
     *
     * scripts.html 側にあった同名ヘルパーを、共通ファクトリから利用できるよう移設したもの。
     * type="button" 固定で、クリック時に onClick を呼ぶ <button> を返す。
     *
     * @param {string} label - ボタンの表示文言
     * @param {string} className - ボタンに付与するクラス文字列
     * @param {(event: Event) => void} onClick - クリック時のハンドラ
     * @returns {HTMLButtonElement} 生成したボタン要素
     */
    function createActionButton(label, className, onClick) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = label;
      button.className = className;
      button.addEventListener('click', onClick);
      return button;
    }

    /**
     * リスト1行分の <li> を生成する低レベル共通ファクトリ。
     *
     * scripts.html の renderRecurringList / renderTransactions / renderRecurringTransactionHistory が
     * 共有していた「li(itemClass) > content(contentClass) に本文要素を並べ、任意で操作ボタン群を
     * actions(actionsClass) として末尾に付ける」という外枠構造を集約する。
     * 本文要素（contentChildren）の中身は呼び出し側が組み立てて渡すため、生成 DOM は集約前と同一になる。
     *
     * @param {{
     *   itemClass: string;
     *   contentClass: string;
     *   contentChildren: ReadonlyArray<HTMLElement>;
     *   actionsClass?: string;
     *   actions?: ReadonlyArray<HTMLElement> | null;
     * }} options
     *   - itemClass: 行 <li> のクラス
     *   - contentClass: 本文ラッパ <div> のクラス
     *   - contentChildren: 本文ラッパへ順番に append する要素群
     *   - actionsClass: 操作ボタン群ラッパ <div> のクラス（actions 指定時に使用）
     *   - actions: 操作ボタン群（null / 空配列なら操作ボタンラッパ自体を生成しない）
     * @returns {HTMLLIElement} 組み立てた <li> 要素
     */
    function createListItem(options) {
      const item = document.createElement('li');
      item.className = options.itemClass;

      const content = document.createElement('div');
      content.className = options.contentClass;
      options.contentChildren.forEach((child) => content.appendChild(child));
      item.appendChild(content);

      // 操作ボタンが指定されている場合のみ、操作ボタン群ラッパを末尾に追加する。
      if (options.actions && options.actions.length > 0) {
        const actions = document.createElement('div');
        // actionsClass 未指定でも className に文字列 "undefined" が入らないよう空文字でフォールバックする。
        actions.className = options.actionsClass ?? '';
        options.actions.forEach((button) => actions.appendChild(button));
        item.appendChild(actions);
      }

      return item;
    }

    /**
     * 取引1件分のリスト行 <li> を生成する共通ファクトリ。
     *
     * scripts.html の renderTransactions（取引一覧）と renderRecurringTransactionHistory（全取引履歴）は
     * 「日付 + 取引種別バッジのヘッダー行 → （任意で）銘柄名 → 金額/口数/基準価額の詳細行」という
     * ほぼ同一の本文構造を持つため、その組み立てを集約する。差分（ヘッダーのクラス、銘柄名の有無、
     * 操作ボタンの有無）は options で切り替える。外枠は createListItem に委譲する。
     *
     * @param {{
     *   type: 'SPOT_PURCHASE' | 'REDEMPTION' | string;
     *   date: string;
     *   amount: number;
     *   units: number;
     *   navValue: number;
     * }} transaction - 取引データ（type は SPOT_PURCHASE / REDEMPTION / それ以外=積立購入）
     * @param {{
     *   itemClass: string;
     *   contentClass: string;
     *   headerClass: string;
     *   detailClass: string;
     *   badgeSpotClass: string;
     *   badgeRedemptionClass: string;
     *   badgeRecurringClass: string;
     *   fundName?: string | null;
     *   fundNameClass?: string;
     *   actionsClass?: string;
     *   actions?: ReadonlyArray<HTMLElement> | null;
     * }} options
     *   - headerClass: ヘッダー行 <div> のクラス（一覧と履歴で余白指定が異なるため引数化）
     *   - badge*Class: 取引種別バッジのクラス（スポット購入 / 売却 / 積立購入）
     *   - fundName: 指定時のみヘッダーと詳細の間に銘柄名 <div> を挿入する（履歴一覧で使用）
     *   - fundNameClass: 銘柄名 <div> のクラス（fundName 指定時に使用）
     *   - actions / actionsClass: createListItem に委譲する操作ボタン群
     * @returns {HTMLLIElement} 取引1件分の <li> 要素
     */
    function createTransactionItem(transaction, options) {
      const contentChildren = [];

      // 日付 + 取引種別バッジを含むヘッダー行
      const header = document.createElement('div');
      header.className = options.headerClass;

      const date = document.createElement('strong');
      date.textContent = transaction.date;

      const badge = document.createElement('span');
      if (transaction.type === 'SPOT_PURCHASE') {
        badge.className = options.badgeSpotClass;
        badge.textContent = 'スポット購入';
      } else if (transaction.type === 'REDEMPTION') {
        badge.className = options.badgeRedemptionClass;
        badge.textContent = '売却';
      } else {
        badge.className = options.badgeRecurringClass;
        badge.textContent = '積立購入';
      }

      header.appendChild(date);
      header.appendChild(badge);
      contentChildren.push(header);

      // 銘柄名（全取引履歴のみ。fundName 未指定の取引一覧では挿入しない）
      if (options.fundName != null) {
        const fundNameDiv = document.createElement('div');
        // fundNameClass 未指定でも className に文字列 "undefined" が入らないよう空文字でフォールバックする。
        fundNameDiv.className = options.fundNameClass ?? '';
        fundNameDiv.textContent = options.fundName;
        contentChildren.push(fundNameDiv);
      }

      // 金額 / 口数 / 基準価額の詳細行（売却は口数を絶対値表示する）
      const detail = document.createElement('span');
      detail.className = options.detailClass;
      const unitsDisplay =
        transaction.type === 'REDEMPTION'
          ? `${Math.abs(transaction.units).toLocaleString()}口`
          : `${transaction.units.toLocaleString()}口`;
      const navDisplay = `${transaction.navValue.toLocaleString()}円`;
      detail.textContent = `${transaction.amount.toLocaleString()}円 / ${unitsDisplay} / 基準価額: ${navDisplay}`;
      contentChildren.push(detail);

      const hasRecordedTax =
        transaction.type === 'REDEMPTION' &&
        (transaction.incomeTax !== null || transaction.residentTax !== null);
      if (hasRecordedTax) {
        const taxDetail = document.createElement('span');
        taxDetail.className = options.detailClass;
        // null（税額未記録）は0円と区別して「未記録」と表示する。金額表記は同一明細行の
        // 既存表示（N,NNN円）と揃えるため formatCurrency を再利用する。
        const formatTax = (value) => (value === null ? '未記録' : formatCurrency(value));
        taxDetail.textContent = `税: 所得税 ${formatTax(transaction.incomeTax)} ／ 住民税 ${formatTax(transaction.residentTax)}`;
        contentChildren.push(taxDetail);
      }

      return createListItem({
        itemClass: options.itemClass,
        contentClass: options.contentClass,
        contentChildren,
        actionsClass: options.actionsClass,
        actions: options.actions || null,
      });
    }

    /**
     * フォームの入力欄を初期状態へ戻す共通ヘルパー。
     *
     * scripts.html の resetTransactionForm / resetRecurringForm が共有していた
     * 「テキスト/数値/日付系 input を空文字へ」「チェックボックスを true へ」という
     * 単純なクリア処理のみを集約する。各フォーム固有の表示リセット（基準価額表示など）は
     * 呼び出し側に残す。
     *
     * @param {{
     *   textInputs?: ReadonlyArray<HTMLInputElement|HTMLSelectElement>;
     *   checkedInputs?: ReadonlyArray<HTMLInputElement>;
     * }} options
     *   - textInputs: value を空文字へ戻すinputまたはselect要素
     *   - checkedInputs: checked を true（初期値）へ戻すチェックボックス
     */
    function resetFormFields(options) {
      const opts = options || {};
      (opts.textInputs || []).forEach((input) => {
        input.value = '';
      });
      (opts.checkedInputs || []).forEach((input) => {
        input.checked = true;
      });
    }

    // ========================================
    // タブ別データローダーの登録機構（H6 #152）
    // ========================================

    /**
     * タブ名 → データ読み込み関数 の登録表。
     *
     * 従来はパフォーマンスタブの読み込みを window.loadPerformanceData という
     * 暗黙のグローバル変数で連携しており、「どこで定義され、どこから呼ばれるか」が
     * コードから追えなかった。本登録機構で連携を明示的な API に置き換える。
     * （読み込み順の前提: common-scripts → scripts → performance-scripts。
     *   登録はスクリプト読み込み時、参照はユーザー操作時のため順序問題は生じない。）
     *
     * プロトタイプを持たないオブジェクトとして構築する。通常の {} だと 'constructor' や
     * 'toString' のような継承プロパティ名で照会された際に Object.prototype の関数が
     * 返ってしまい、「未登録なら null」という契約が破れるため。
     */
    const tabDataLoaders = Object.create(null);

    /**
     * タブのデータ読み込み関数を登録する。
     * @param {string} tabName - タブ名（例: 'performance'）。
     * @param {() => void} loader - タブ表示時に呼び出すデータ読み込み関数。
     */
    function registerTabDataLoader(tabName, loader) {
      tabDataLoaders[tabName] = loader;
    }

    /**
     * 登録済みのタブデータ読み込み関数を取得する。
     * @param {string} tabName - タブ名。
     * @returns {(() => void) | null} 登録済みの関数。未登録なら null。
     */
    function getTabDataLoader(tabName) {
      return typeof tabDataLoaders[tabName] === 'function' ? tabDataLoaders[tabName] : null;
    }

    // ========================================
    // 日付ヘルパー（H6 #152）
    // ========================================
    // 従来は「toLocaleDateString('sv-SE')」「getMonth 等の手書き整形」
    // 「setMonth/setFullYear の直操作」の3方式が各スクリプトに散在していたため、
    // UI 層の日付処理を本ヘルパー群へ集約する（各関数の出力は集約前と同一）。

    /**
     * 今日の日付を YYYY-MM-DD 形式（ローカルタイムゾーン）で返す。
     * 日次リフレッシュ判定のキーとして使用する。
     * @returns {string} 例: '2026-07-25'
     */
    function getLocalDateString() {
      return new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD形式（ローカルタイムゾーン）
    }

    /**
     * ISO 日時文字列を「M/D H:mm」の短い表示形式へ整形する。
     * 最終更新時刻の表示に使用する（分のみ2桁ゼロ埋め。集約前の出力と同一）。
     * @param {string} isoString - Date に解釈可能な日時文字列。
     * @returns {string} 例: '7/25 9:05'
     */
    function formatShortDateTime(isoString) {
      const date = new Date(isoString);
      const month = date.getMonth() + 1;
      const day = date.getDate();
      const hours = date.getHours();
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${month}/${day} ${hours}:${minutes}`;
    }

    /**
     * 期間フィルタの起点日（この日以降のデータを採用する）を計算する。
     * パフォーマンスグラフの期間切替（1ヶ月/3ヶ月/1年）で使用する。
     * @param {'1m' | '3m' | '1y'} period - 期間種別。
     * @param {Date} now - 基準となる現在日時。
     * @returns {Date | null} 起点日。未知の期間種別なら null（呼び出し側で全件扱い）。
     */
    function getPeriodCutoffDate(period, now) {
      const cutoffDate = new Date(now);
      switch (period) {
        case '1m':
          cutoffDate.setMonth(now.getMonth() - 1);
          return cutoffDate;
        case '3m':
          cutoffDate.setMonth(now.getMonth() - 3);
          return cutoffDate;
        case '1y':
          cutoffDate.setFullYear(now.getFullYear() - 1);
          return cutoffDate;
        default:
          return null;
      }
    }

    return {
      NAV_SOURCE_KINDS,
      populateNavSourceKindSelect,
      buildNavSourceFields,
      resolveNavSourceKind,
      formatNavSourceLabel,
      callApi,
      formatCurrency,
      formatPercent,
      getAssetClassOrder,
      setLoading,
      createSetMessage,
      renderFundSelect,
      createEmptyListItem,
      createActionButton,
      createListItem,
      createTransactionItem,
      createAssetClassBadge,
      populateAssetClassSelect,
      resetFormFields,
      registerTabDataLoader,
      getTabDataLoader,
      getLocalDateString,
      formatShortDateTime,
      getPeriodCutoffDate,
    };
  })();
</script>
